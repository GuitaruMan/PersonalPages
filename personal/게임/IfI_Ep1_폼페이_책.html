<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이야기 책</title>
<!-- 이프 아이 이야기 책(1단계: 읽기만). 자료는 window.책자료(내보낸 파일) 또는 /api/reader(책_자료.py).
     자료 글은 textContent로만 넣는다. 규칙: 협업메모리/설계_사람을위한책.md, 계획_사람을위한책_1단계.md 일거리 5 -->
<style>
:root{--paper:#f7f2e7;--page:#fffdf7;--ink:#2b2620;--soft:#6f665a;--faint:#a1978a;--line:#e2d9c7;--accent:#8a4b2a;--accent-soft:#f1e2d3;--link:#7a3f1f;
--fork:#fbeee0;--fork-line:#d9a877;--trace:#eef1e6;--trace-line:#a9b98a;--aside:#eef0f4;--aside-line:#9aa6c0;--dir:#eef0f4;--dir-ink:#55607a;
--shadow:0 1px 3px rgba(60,40,20,.08);--tag-a:#e9e2f5;--tag-a-ink:#5b4a86;--tag-b:#e1edf3;--tag-b-ink:#2f6077;--tag-c:#f6e4d8;--tag-c-ink:#8a4b2a;
--draft:#fff1c2;--draft-ink:#7a5a00;--flash:#ffe9a8;--warn:#fdecc8;--warn-ink:#7a4b00}
:root[data-theme="dark"]{--paper:#1d1b18;--page:#26231f;--ink:#ece4d6;--soft:#b8ad9c;--faint:#857b6e;--line:#3b362f;--accent:#e0a37a;--accent-soft:#3a2c22;--link:#f0b98f;
--fork:#33281f;--fork-line:#8c6440;--trace:#262c22;--trace-line:#66774c;--aside:#262a33;--aside-line:#5d6a86;--dir:#262a33;--dir-ink:#aab5cf;--shadow:0 1px 3px rgba(0,0,0,.4);
--tag-a:#342d44;--tag-a-ink:#c8b9ec;--tag-b:#223640;--tag-b-ink:#9fcfe4;--tag-c:#3d2c22;--tag-c-ink:#efb592;--draft:#3e3415;--draft-ink:#f0d27a;--flash:#5a4a1c;--warn:#3d2f12;--warn-ink:#f3c97a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo","바탕",Batang,serif;font-size:17px;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
.ui,header,.toc,.chip,.flow,.lede,.choice .note,.legend,.band{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px 0}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title-row h1{margin:0;font-size:20px}
.title-row .sub{color:var(--soft);font-size:13px}
#find{margin-left:auto;min-width:0;width:220px;max-width:100%;border:1px solid var(--line);border-radius:16px;padding:3px 12px;background:var(--page);font-size:14px}
.tabs{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:6px 15px;cursor:pointer;border-radius:8px 8px 0 0;color:var(--soft);font-size:15px}
.tab[aria-selected="true"]{background:var(--page);border-color:var(--line);color:var(--ink);font-weight:700;margin-bottom:-1px}
.switches{display:flex;gap:14px;flex-wrap:wrap;padding:7px 0 9px;font-size:14px;color:var(--soft);align-items:center}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:19px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--page);box-shadow:var(--shadow);transition:left .15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:17px}
#toc-btn{display:none;border:1px solid var(--line);background:var(--page);border-radius:14px;padding:1px 12px;font-size:13px;cursor:pointer}
.band{max-width:1180px;margin:10px auto 0;padding:8px 14px;border-radius:8px;background:var(--warn);color:var(--warn-ink);font-size:14px;cursor:pointer}
.band ul{margin:6px 0 0;padding-left:20px;cursor:auto}
main{max-width:1180px;margin:0 auto;padding:20px 16px 120px}
.view{display:none}.view.on{display:block}
.lede{color:var(--soft);font-size:15px;margin:0 0 16px;max-width:42em}
#results{display:none;max-width:1180px;margin:0 auto;padding:8px 16px}
#results.on{display:block}
#results .box{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow)}
.hit{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:5px 2px;cursor:pointer;font-size:15px}
.hit small{color:var(--faint);margin-right:8px}
/* 대본 */
.script-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto;font-size:14px;padding-right:4px}
.toc details{margin-bottom:6px}.toc summary{cursor:pointer;font-weight:700;color:var(--accent)}
.toc button{display:block;width:100%;text-align:left;background:none;border:none;padding:2px 6px;cursor:pointer;color:var(--ink);border-radius:5px;font-size:13.5px}
.toc button:hover{background:var(--accent-soft)}.toc button.none{color:var(--faint)}
.scene{background:var(--page);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 26px 16px;margin:0 0 22px;scroll-margin-top:160px}
.scene h2{margin:0;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-size:12px;color:var(--faint);font-weight:400;font-family:"Malgun Gothic",sans-serif}
.part{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 9px;font-weight:400;font-family:"Malgun Gothic",sans-serif}
.nodial{font-size:12px;color:var(--soft);border:1px dashed var(--faint);border-radius:10px;padding:0 8px;font-weight:400;font-family:"Malgun Gothic",sans-serif}
.flow{margin:10px 0 4px;font-size:14px;color:var(--soft);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.flow b{font-weight:400;color:var(--faint);white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:4px 8px}
.go{background:none;border:none;padding:0 2px;cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:3px;font-size:inherit;text-align:left}
.go:hover{background:var(--accent-soft);border-radius:4px}
.cross{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:1px 11px;font-size:13px;cursor:pointer;color:var(--soft)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.script{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.say{display:grid;grid-template-columns:7.5em minmax(0,36em);gap:0 16px;padding:3px 6px;border-radius:6px}
.who{text-align:right;font-weight:700;color:var(--accent);font-size:15.5px}
.act{color:var(--faint);font-size:15px}
.tell{text-align:center;font-style:italic;color:var(--soft);margin:10px auto;max-width:32em;padding:3px 8px}
.dir,.note{display:none;margin:6px auto;max-width:32em;text-align:center;font-size:14px;color:var(--dir-ink);background:var(--dir);border-radius:6px;padding:3px 12px;font-family:"Malgun Gothic",sans-serif}
.dir::before{content:"연출 · ";opacity:.7}.note::before{content:"메모 · ";opacity:.7}
body.show-dir .dir{display:block}body.show-tag .note{display:block}
.odd{color:var(--soft);font-size:15px;border-left:3px solid var(--fork-line);padding-left:10px;margin:6px 0}
.summary{margin:12px 0 4px;color:var(--soft)}
.base{margin:10px 0 0;padding:8px 16px;border-left:3px solid var(--line);color:var(--soft);font-size:15.5px}
.base p{margin:6px 0}.base .more{font-size:13px}
.choices{margin:14px 0 2px;padding-top:10px;border-top:1px dashed var(--line)}
.choice{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:6px 0;cursor:pointer;font-size:16px}
.choice:hover{border-color:var(--accent)}.choice .arrow{color:var(--faint);margin:0 6px}
.choice .dest{color:var(--link);text-decoration:underline;text-underline-offset:3px}
.choice .note{display:block;font-size:13px;color:var(--soft);margin-left:1.3em;background:none;text-align:left;padding:0}
.choice .note::before{content:""}
/* 표시 */
.tag{display:none;font-size:11.5px;border-radius:9px;padding:0 7px;margin:0 3px;vertical-align:2px;font-family:"Malgun Gothic",sans-serif;white-space:nowrap;font-style:normal;font-weight:400}
.tag-제안{background:var(--tag-a);color:var(--tag-a-ink)}.tag-대장{background:var(--tag-b);color:var(--tag-b-ink)}.tag-사용자{background:var(--tag-c);color:var(--tag-c-ink)}
.tag-초안{background:var(--draft);color:var(--draft-ink)}
.aside-note{display:none;color:var(--soft);font-size:15px}
body.show-tag .tag{display:inline-block}body.show-tag .aside-note{display:inline}
.legend{display:none;gap:8px;font-size:13px;color:var(--soft);margin:-6px 0 14px;flex-wrap:wrap;align-items:center}
body.show-tag .legend{display:flex}
.label{font-size:12px;font-weight:700;color:var(--accent);margin:0 4px;font-family:"Malgun Gothic",sans-serif}
/* 이야기 */
.chapter h2{font-size:24px;margin:28px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.sec{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:16px 26px 8px;margin:14px 0;scroll-margin-top:160px}
.sec h3{margin:0 0 4px;font-size:19px}
.sec p,.sec li{max-width:40em}.sec p{margin:10px 0}
.box{border-radius:8px;padding:9px 16px;margin:12px 0;max-width:40em}
.box .lab{display:block;font-size:13px;font-weight:700;font-family:"Malgun Gothic",sans-serif}
.box.fork{background:var(--fork);border-left:4px solid var(--fork-line)}.box.trace{background:var(--trace);border-left:4px solid var(--trace-line)}
.box.aside{background:var(--aside);border-left:4px solid var(--aside-line)}
table.t{border-collapse:collapse;margin:10px 0;font-size:15px;max-width:100%;display:block;overflow-x:auto}
table.t td{background:var(--page)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;line-height:1.6}
table.t th{background:var(--accent-soft);font-size:13.5px;font-family:"Malgun Gothic",sans-serif}
/* 지도 */
.parts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.map{max-width:640px;margin:0 auto}
.mpart{display:none}.mpart.on{display:block}
.part-head{text-align:center;font-weight:700;color:var(--accent);margin:18px 0 8px;font-size:15px;font-family:"Malgun Gothic",sans-serif}
.node{background:var(--page);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);scroll-margin-top:170px;position:relative}
.node.has-script{border-color:var(--accent)}
.node.side{margin-left:64px;border-style:dashed}
.node.side::before{content:"곁길";position:absolute;left:-54px;top:12px;font-size:12px;color:var(--soft);font-family:"Malgun Gothic",sans-serif}
.node h4{margin:0;font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node .sum{color:var(--soft);font-size:14.5px;line-height:1.6;margin:2px 0 4px}
.node .meet{font-size:12.5px;color:var(--accent);font-family:"Malgun Gothic",sans-serif}
.down{text-align:center;color:var(--faint);font-size:20px;line-height:1;margin:5px 0}
.forks{margin:6px 0 6px 18px;padding-left:16px;border-left:2px solid var(--fork-line);font-family:"Malgun Gothic",sans-serif}
.fk{font-size:14.5px;margin:5px 0;line-height:1.55}.fk .lbl{font-weight:700}.fk .sm{display:block;color:var(--soft);font-size:13px}
.ending{font-size:11.5px;border-radius:9px;padding:0 7px;background:var(--tag-c);color:var(--tag-c-ink);margin-left:6px;font-weight:400}
h3.big{margin:40px 0 6px;font-size:20px}
.stale{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:6px 12px;font-size:14px;margin:6px 0}
/* 인물 */
.group h3{margin:20px 0 10px;font-size:18px;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);scroll-margin-top:160px}
.card h4{margin:0 0 4px;font-size:19px}.card p{margin:0;font-size:15.5px;line-height:1.7}
.card .also{font-size:13px;color:var(--faint);margin-left:6px;font-weight:400}
.card .role{color:var(--accent);font-size:14px;margin:0 0 4px;font-family:"Malgun Gothic",sans-serif}
.traits{margin:8px 0 0;font-size:14.5px;line-height:1.6}
.traits dt{font-weight:700;color:var(--soft);font-size:13px;font-family:"Malgun Gothic",sans-serif;margin-top:4px}
.traits dd{margin:0}
.decided{margin:24px 0;background:var(--page);border:1px solid var(--line);border-radius:12px;padding:10px 18px}
.decided summary{cursor:pointer;font-weight:700;color:var(--accent)}
.who-link{color:inherit;font-weight:700;text-decoration:none;padding:0}
.who-link:hover{text-decoration:underline}
.tag-새로{background:var(--tag-a);color:var(--tag-a-ink)}
#back{position:fixed;right:18px;bottom:18px;z-index:9;display:none;background:var(--ink);color:var(--paper);border:none;border-radius:22px;padding:10px 18px;font-size:15px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#back.on{display:block}
/* 고치기(서버에서만 — 내보낸 읽기 전용 파일에는 고치기 스크립트가 없어 안 보임) */
.edit-only{display:none}
body.edit-on .edit-only{display:inline-flex}
body.edit-on .addbar.edit-only{display:flex}
body.edit-on .line{cursor:pointer;border-radius:6px}
body.edit-on .line:hover,body.edit-on .stitle:hover,body.edit-on .choice:hover{background:var(--accent-soft)}
body.edit-on .stitle{cursor:pointer}
.line{position:relative}
.mv{position:absolute;left:-30px;top:2px;flex-direction:column;gap:1px}
.mv button{border:1px solid var(--line);background:var(--page);border-radius:4px;font-size:10px;line-height:1.2;padding:0 4px;cursor:pointer;color:var(--soft)}
.addbar{gap:8px;margin:10px 0 0;flex-wrap:wrap}
.editing{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:6px 0;font-family:"Malgun Gothic",sans-serif;font-size:15px}
.editing .fld{display:block;margin:0 0 6px}
.editing .fld span{display:block;font-size:12.5px;color:var(--soft)}
.editing input,.editing textarea{width:100%;border:1px solid var(--accent);border-radius:6px;padding:5px 8px;background:var(--page)}
.editing textarea{min-height:3.4em;resize:vertical}
.editing .row,.conflict .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--page);border-radius:6px;padding:3px 12px;cursor:pointer;font-size:14px;font-family:"Malgun Gothic",sans-serif}
.btn.main{background:var(--accent);color:var(--page);border-color:var(--accent)}
.why{color:#b3261e;font-size:14px;min-height:0}
:root[data-theme="dark"] .why{color:#ff8a80}
.dest-note{color:var(--faint);font-size:13px}
.nope{color:var(--soft);font-size:13px;font-family:"Malgun Gothic",sans-serif}
.saved{display:inline-block;margin-left:8px;font-size:12px;background:#dff1e1;color:#1f6b2c;border-radius:9px;padding:0 8px;font-family:"Malgun Gothic",sans-serif;font-style:normal;font-weight:400}
.conflict{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:10px 14px;margin:10px 0;font-family:"Malgun Gothic",sans-serif;font-size:14px}
.conflict .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conflict .two>div{background:var(--page);color:var(--ink);border-radius:6px;padding:6px 10px;max-height:16em;overflow:auto}
.conflict h4{margin:0 0 4px;font-size:13px}
.logbtn{margin-left:auto;border:1px solid var(--line);background:var(--page);border-radius:14px;padding:2px 12px;font-size:13px;cursor:pointer;color:var(--soft);align-self:center}
#log{display:none;max-width:1180px;margin:0 auto;padding:8px 16px}
#log.on{display:block}
#log .box{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow);font-family:"Malgun Gothic",sans-serif}
#log h3{margin:4px 0}
.log-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:5px 2px;cursor:pointer;font-size:14.5px}
.log-row small{display:block;color:var(--faint)}
.conflict .diff{background:var(--flash);border-radius:4px;padding:0 4px}
.marks-note{font-size:13.5px;color:var(--warn-ink);background:var(--warn);border-radius:6px;padding:4px 10px;margin:4px 0}
body.edit-on #view-story [data-sec],body.edit-on #view-story .sectitle{cursor:pointer;border-radius:6px}
body.edit-on #view-story [data-sec]:hover,body.edit-on #view-story .sectitle:hover{background:var(--accent-soft)}
#undo{position:fixed;left:18px;bottom:18px;z-index:9;display:none;background:var(--accent);color:var(--page);border:none;border-radius:22px;padding:9px 16px;font-size:14px;cursor:pointer}
#undo.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:10;display:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;font-size:14px;max-width:90vw}
#toast.on{display:block}
.flash{animation:flash 1.8s ease-out}@keyframes flash{0%,30%{background:var(--flash)}}
@media (max-width:900px){.script-wrap{grid-template-columns:1fr}.toc{display:none;position:static;max-height:none}.toc.open{display:block}#toc-btn{display:inline-block}}
@media (max-width:620px){body{font-size:16.5px}.scene,.sec{padding:14px 14px 10px}.say{grid-template-columns:1fr}.who{text-align:left}
.node.side{margin-left:26px}.node.side::before{display:none}.tab{padding:6px 10px}#find{width:100%;margin-left:0}
.mv{position:static;flex-direction:row;margin-right:6px}.conflict .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title-row"><h1 id="book-title">이야기 책</h1><span class="sub" id="made"></span>
      <input id="find" type="search" placeholder="찾기 — 낱말·인물·장면" aria-label="찾기"></div>
    <div class="tabs" role="tablist">
      <button class="tab" data-view="story">이야기</button><button class="tab" data-view="script">대본</button>
      <button class="tab" data-view="map">갈림길 지도</button><button class="tab" data-view="people">인물</button>
      <button id="log-btn" class="logbtn" style="display:none">고친 기록</button>
    </div>
    <div class="switches">
      <label class="switch"><input type="checkbox" id="sw-dir">연출 보기</label>
      <label class="switch"><input type="checkbox" id="sw-tag">누가 정했는지 보기</label>
      <label class="switch"><input type="checkbox" id="sw-dark">밤 화면</label>
      <label class="switch" id="sw-edit-wrap" style="display:none"><input type="checkbox" id="sw-edit">고치기</label>
      <button id="toc-btn">차례</button>
    </div>
  </div>
</header>
<div id="bands"></div>
<div id="results"><div class="box" id="results-box"></div></div>
<div id="log"></div>
<main>
  <section class="view" id="view-story"></section>
  <section class="view" id="view-script"></section>
  <section class="view" id="view-map"></section>
  <section class="view" id="view-people"></section>
</main>
<button id="back">↩ 방금 보던 곳으로</button>
