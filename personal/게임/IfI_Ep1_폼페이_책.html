text": "[여기서 마을 살피기 플레이: 광장 웅덩이·금 간 항아리·긴 우물 줄을 찾아 본다. 다 못 봐도 넘어간다]", "src": [17], "draft": true, "mark": 16}, {"kind": "say", "who": "주인공", "act": "웅덩이 앞에서, 혼잣말", "text": "비 온 지가 언젠데 아직 안 말랐네. 모기가 알 낳기 딱 좋겠어.", "src": [19], "draft": true, "mark": 18}, {"kind": "say", "who": "주인공", "act": "금 간 항아리 앞에서, 혼잣말", "text": "물이 초록색이야. 안에서 뭐가 꼼지락거려.", "src": [21], "draft": true, "mark": 20}, {"kind": "say", "who": "주인공", "act": "우물 줄 끝에서, 혼잣말", "text": "줄이 광장까지 왔네. 이러니 다들 가까운 물을 찾지.", "src": [23], "draft": true, "mark": 22}, {"kind": "tell", "text": "광장 한쪽에는 며칠 전 내린 비가 괸 웅덩이가 있다. 바닥이 누렇게 흐리다.", "src": [24], "draft": false}, {"kind": "tell", "text": "아이 둘이 그 앞에 엎드려 손으로 물을 떠 마신다. 염소 한 마리가 곁에서 같은 물에 입을 댄다.", "src": [25], "draft": false}, {"kind": "say", "who": "주인공", "act": "눈살을 찌푸린다", "text": "……저 물을 그냥 마시네.", "src": [26], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "투덜대며 아이를 일으킨다", "text": "목마르면 어째. 우물 줄은 길고 웅덩이는 코앞인데.", "src": [28], "draft": true, "mark": 27}, {"kind": "tell", "text": "주인공은 입을 열려다 다문다. 사흘 된 이방인의 말을 누가 들어 줄까.", "src": [29], "draft": false}, {"kind": "tell", "text": "담 밑에는 금이 간 항아리가 비스듬히 누워 있다. 안에 괸 물이 초록빛으로 탁하다.", "src": [30], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "저렇게 오래 고인 물은……. 일단 기억해 두자.", "src": [31], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [32]}, {"kind": "stage", "text": "주인공이 오두막 앞에 있다.", "src": [33]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [34]}, {"kind": "tell", "text": "오두막 앞. 바닷가에서 어른 여섯이 그물을 끌어올린다. 노래 부를 기운도 없는지 이를 악물고 당긴다.", "src": [35], "draft": false}, {"kind": "tell", "text": "해가 머리 위에 걸렸는데도 줄은 한참을 더 당겨야 끝난다.", "src": [36], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "저 일을 매일 한단 말이지. 허리가 남아나질 않겠어.", "src": [37], "draft": false}, {"kind": "tell", "text": "오두막 옆에서 그물을 손질하던 리비아가 주인공이 다가오자 손을 더 빨리 놀린다. 눈은 마주치지 않는다.", "src": [38], "draft": false}, {"kind": "say", "who": "프리마", "act": "국그릇을 내민다", "text": "또 안 먹었죠? 얼굴에 다 써 있어요. 먹어요.", "src": [39], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "사람들이 저만 보면 피하더라고요. 폐가 될까 봐…….", "src": [40], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "낯선 건 누구나 처음엔 무서운 법이에요. 시간이 걸려요.", "src": [41], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "그래도 당신은 우리 집 손님이에요. 그건 변하지 않아요.", "src": [42], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "그물 쪽을 턱으로 가리킨다", "text": "저건 해 지기 전엔 안 끝난다.", "src": [43], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "일손은 하나라도 아쉽다. 내일은 산에 간다. 따라와라.", "src": [44], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "네. ……고맙습니다.", "src": [45], "draft": false}, {"kind": "tell", "text": "사흘째 저녁. 주인공은 하루 동안 본 것을 머릿속에 하나씩 적어 둔다.", "src": [46], "draft": false}, {"kind": "tell", "text": "웅덩이, 금 간 항아리, 그물을 끄는 사람들.", "src": [47], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "내가 아는 게 도움이 될지도 몰라. ……하지만 지금은 내 말을 들어 줄 사람이 없어.", "src": [48], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "먼저 눈여겨보자. 말하는 건 그다음이야.", "src": [49], "draft": false}], "choices": [{"text": "계속", "to": "1-050", "to_title": "산 사냥", "condition": "", "edge": 0, "src": [52]}]}, "1-050": {"id": "1-050", "title": "산 사냥", "has_script": true, "stamp": "0e87605ca06512e4", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 섬 뒤편 산(사냥터).", "src": [2]}, {"kind": "tell", "text": "섬 뒤편 산. 세르기우스는 말이 없다. 손짓만 한다.", "src": [3], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "창은 이렇게. 손목 말고 어깨로.", "src": [4], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "손바닥을 들어 바람을 잰다", "text": "바람을 등져라. 짐승은 코로 본다.", "src": [5], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "발. 뒤꿈치부터 놓지 마. 소리 난다.", "src": [6], "draft": false}, {"kind": "tell", "text": "저 위 바위틈에 산양 한 마리.", "src": [7], "draft": false}, {"kind": "say", "who": "주인공", "act": "숨을 죽이고 창을 던진다", "text": "", "src": [8], "draft": false}, {"kind": "tell", "text": "창은 엉뚱한 나무에 꽂히고, 산양은 달아난다.", "src": [9], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "처음으로 웃는다", "text": "도시 사람이었나 보군. 손이 너무 고와.", "src": [10], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "……한 번만 더요.", "src": [11], "draft": false}, {"kind": "tell", "text": "[여기서 사냥 플레이: 들토끼, 이어서 산양]", "src": [12], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "됐다. 오늘 저녁은 굶지 않겠군.", "src": [13], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [14]}, {"kind": "stage", "text": "주인공, 세르기우스가 오두막 앞에 있다.", "src": [15, 16]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [17]}, {"kind": "tell", "text": "마을로 내려오는 길, 아이들이 졸졸 따라왔다.", "src": [18], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "아저씨 신발 또 보여 줘! 이거 뭘로 만든 거야?", "src": [19], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "우리가 노래 가르쳐 줄게. 그물 당길 때 부르는 거야.", "src": [20], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "따라 해 봐. 하나, 둘, 당겨라!", "src": [21], "draft": false}, {"kind": "tell", "text": "그날 저녁, 프리마가 산양 고기로 국을 끓였다.", "src": [22], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "오늘은 고기가 넉넉하네요.", "src": [23], "draft": false}, {"kind": "tell", "text": "리비아가 그릇을 날라 와 주인공 앞에 놓는다. 눈은 마주치지 않는다.", "src": [24], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "고기 잡아 온 사람 몫이래요.", "src": [25], "draft": false}], "choices": [{"text": "계속", "to": "1-055", "to_title": "그물 당기기", "condition": "", "edge": 0, "src": [28]}]}, "1-055": {"id": "1-055", "title": "그물 당기기", "has_script": true, "stamp": "ec507fc38d8ed9c5", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 그물 당기는 물가.", "src": [3]}, {"kind": "tell", "text": "사냥 다음 날 아침. 포구 물가에서 어부들이 기다란 그물을 바다에 둘러 놓고 양쪽 끝 줄을 잡는다.", "src": [4], "draft": true}, {"kind": "say", "who": "티로", "act": "", "text": "아저씨, 저기 봐! 아저씨들 그물 당긴다! 같이 가!", "src": [5], "draft": true}, {"kind": "say", "who": "파울라", "act": "", "text": "어제 배운 노래, 이럴 때 부르는 거예요.", "src": [6], "draft": true}, {"kind": "tell", "text": "줄 끝에 선 늙은 뱃사공이 주인공을 위아래로 훑어본다.", "src": [7], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "바다에서 건져 왔다는 그 이방인인가. ……손 비는 사람은 다 줄 잡게.", "src": [8], "draft": true}, {"kind": "say", "who": "루키우스", "act": "", "text": "리쿠스 할아버지야. 이 포구에서 그물 제일 오래 당긴 사람.", "src": [9], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "숨은 「하나, 둘」에 고르고, 「당겨라」에 한꺼번에. 따로 당기면 줄만 헛돈다.", "src": [10], "draft": true}, {"kind": "tell", "text": "아이들이 노래를 시작하자 어부들이 굵은 목소리로 받는다.", "src": [11], "draft": true}, {"kind": "say", "who": "마을 사람", "act": "", "text": "하나, 둘, 당겨라! 하나, 둘, 당겨라!", "src": [12], "draft": true}, {"kind": "tell", "text": "[여기서 그물 당기기 플레이: 노래의 「당겨라」에 맞춰 줄을 당긴다. 박자가 맞을수록 빨리 올라온다]", "src": [13], "draft": true}, {"kind": "tell", "text": "노래가 몇 바퀴 돌자 그물 자루가 모래 위로 올라온다. 은빛 생선이 펄떡인다.", "src": [14], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "허리를 펴며 웃는다", "text": "박자는 맞네. 팔은 아직 멀었고.", "src": [15], "draft": true}, {"kind": "tell", "text": "리쿠스가 생선 한 마리를 집어 주인공에게 던진다.", "src": [16], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "품삯이야. 줄 잡은 사람은 누구든 한 마리.", "src": [17], "draft": true}, {"kind": "say", "who": "주인공", "act": "생선을 받아 든다", "text": "……고맙습니다.", "src": [18], "draft": true}, {"kind": "say", "who": "티로", "act": "", "text": "이 노래는 몸이 외우는 거야. 한번 외우면 안 잊어.", "src": [19], "draft": true}, {"kind": "tell", "text": "며칠 전 노래도 없이 이를 악물고 그물을 끌던 어른들이 떠오른다. 오늘은 노래가 줄을 당긴다.", "src": [20], "draft": true}], "choices": [{"text": "계속", "to": "1-060", "to_title": "하늘에 뜬 물고기", "condition": "", "edge": 0, "src": [23]}]}, "1-060": {"id": "1-060", "title": "하늘에 뜬 물고기", "has_script": true, "stamp": "647150dc5bf025ea", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 바닷가 모래밭.", "src": [2]}, {"kind": "tell", "text": "열흘째 되는 날. 어른들은 일하러 나가고 모래밭에는 아이들만 남았다.", "src": [3], "draft": false}, {"kind": "say", "who": "티로", "act": "모래에 막대를 꽂았다 뽑는다", "text": "심심해. 어제도 심심했고 그제도 심심했어.", "src": [4], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "조개는 안 주웠니?", "src": [5], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "아침에 다 했어!", "src": [6], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "놀거리가 없잖아. 바닷가엔 모래랑 물밖에 없는걸.", "src": [7], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "아저씨네 고향 애들은 뭐 하고 놀았어?", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "먼 하늘을 올려다본다", "text": "바람이 좋네. ……그래, 바람이 있으면 되지.", "src": [9], "draft": false}, {"kind": "tell", "text": "바다 쪽에서 꾸준히 바람이 불어온다. 갈대밭이 한쪽으로 눕는다.", "src": [10], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "이 섬에는 연이 없구나. 아이들은 하늘에 뜬 걸 본 적이 없겠지.", "src": [11], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "갈대 가는 것 두 개, 헌 아마천 한 조각, 그물실 한 타래. 구해 올 수 있어?", "src": [12], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "있어! 우리 엄마 헌 보자기!", "src": [13], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "그물실은 내가 가져올게. 우리 집에 많아.", "src": [14], "draft": false}, {"kind": "say", "who": "파울라", "act": "망설인다", "text": "엄마가 이방인 곁에 너무 붙어 다니지 말랬는데…….", "src": [15], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "바다가 데려간다고 했거든. 이방인 옆에 있으면.", "src": [16], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "우리 벌써 열흘 붙어 다녔는데 안 데려갔어.", "src": [17], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "나 물에도 안 빠졌어!", "src": [18], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "……알았어. 나도 지켜볼게. 누나니까.", "src": [19], "draft": false}, {"kind": "tell", "text": "주인공이 갈대 두 개를 열십 자로 묶고, 헌 천에 숯으로 물고기를 그려 씌운다.", "src": [20], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "꼬리 끝에는 그물 조각을 묶어. 바람에 흔들려야 안 뒤집혀.", "src": [21], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "이 끝을 잡고 바람을 등지고 달려. 실은 내가 풀어 줄게.", "src": [22], "draft": false}, {"kind": "tell", "text": "티로가 달려간다. 물고기는 두어 번 펄럭이다 모래에 처박힌다.", "src": [23], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "안 뜨잖아!", "src": [24], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "괜찮아. 바람을 등지고, 실을 조금씩 풀어 주면서. 한 번 더.", "src": [25], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "어른들이 사냥 갈 때 하는 말이다. 바람을 등져라.", "src": [26], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "맞아. 바람은 누구한테나 있어. 잘 쓰는 사람이 이기는 거야.", "src": [27], "draft": false}, {"kind": "tell", "text": "[여기서 연 날리기 플레이: 바람을 등지고 달리며 실을 풀어 준다]", "src": [28], "draft": false}, {"kind": "tell", "text": "물고기가 바람을 타고 떠올랐다. 꼬리가 하늘에서 물결처럼 흔들린다.", "src": [29], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "떴다! 물고기가 하늘에 떴어! 페레! 페레!", "src": [30], "draft": false}, {"kind": "tell", "text": "그물을 손질하던 어른들이 손을 멈춘다. 가까이 오지는 않고 멀리서 올려다본다.", "src": [31], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "제 아이의 손목을 잡아끈다", "text": "이방인 곁엔 가지 말랬지!", "src": [33], "draft": true, "mark": 32}, {"kind": "say", "who": "마을 사람", "act": "끌던 손이 느려진다", "text": "……저게 뭐야. 물고기가 하늘에 떠 있어.", "src": [34], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "아줌마, 봐! 페레가 만들어 줬어! 우리 거야!", "src": [36], "draft": true, "mark": 35}, {"kind": "say", "who": "마을 사람", "act": "조심스럽게", "text": "신께서 보내신 건 아니겠지요.", "src": [37], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "바람이에요. 신께서 이 바다에 늘 불게 하시는 바람에 실을 매어 둔 것뿐이에요.", "src": [38], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "손을 놓는다", "text": "……바람에 실을. 멀리 가진 마라.", "src": [39], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "아저씨, 나도 만들고 싶어. 하나 만들어 줘.", "src": [40], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "만들어 주는 건 쉬워. 그런데 네 손으로 만들면 진짜 네 거야. 옆에서 볼게.", "src": [41], "draft": false}, {"kind": "tell", "text": "루키우스가 갈대를 고르고 묶는다. 주인공은 느슨한 매듭을 손가락으로 짚어 줄 뿐 고쳐 주지 않는다.", "src": [42], "draft": false}, {"kind": "say", "who": "루키우스", "act": "매듭을 다시 당긴다", "text": "이렇게? ……이번엔 안 풀려.", "src": [43], "draft": false}, {"kind": "tell", "text": "루키우스의 물고기가 첫 번에 떠오른다. 파울라가 티로에게 실을 쥐여 준다.", "src": [44], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "페레 아저씨가 한 대로 해. 바람을 등지고, 천천히 풀어 주는 거야.", "src": [45], "draft": false}, {"kind": "tell", "text": "멀찍이 서 있던 세르기우스가 하늘의 물고기를 한참 올려다본다. 말없이 고개를 한 번 끄덕이고 돌아선다.", "src": [46], "draft": false}, {"kind": "tell", "text": "리비아는 그물에서 손을 멈추고 하늘을 본다. 이쪽으로 눈길은 주지 않는다.", "src": [47], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "페레! 내일은 더 큰 거 만들자! 응?", "src": [48], "draft": false}, {"kind": "tell", "text": "아이들이 이제 숨지 않고 이름을 부른다.", "src": [49], "draft": false}, {"kind": "tell", "text": "다음 날부터 아이들이 갈대를 베어 오기 시작했다. 어른들은 말리지 않았다.", "src": [50], "draft": false}], "choices": [{"text": "계속", "to": "1-070", "to_title": "끓인 물", "condition": "", "edge": 0, "src": [53]}]}, "1-070": {"id": "1-070", "title": "끓인 물", "has_script": true, "stamp": "3f31934b9e5c3df8", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 오두막 앞.", "src": [2]}, {"kind": "tell", "text": "보름째. 사흘 내리 퍼붓던 비가 갠 아침, 마당 구석마다 물이 고여 있다.", "src": [3], "draft": false}, {"kind": "tell", "text": "오두막 안에서는 티로가 밤새 배앓이로 토하고 설사를 했다.", "src": [5], "draft": true, "mark": 4}, {"kind": "tell", "text": "프리마는 한숨도 못 자고 젖은 천으로 아이 이마를 닦는다.", "src": [7], "draft": true, "mark": 6}, {"kind": "say", "who": "파울라", "act": "숨이 차서 달려온다", "text": "아주머니, 다른 애들도 줄줄이 그래요.", "src": [9], "draft": true, "mark": 8}, {"kind": "say", "who": "파울라", "act": "", "text": "엄마들이 광장에 모였는데, 어떡해야 할지 몰라요.", "src": [11], "draft": true, "mark": 10}, {"kind": "say", "who": "프리마", "act": "티로를 눕히고 나와 파울라의 어깨를 안는다", "text": "숨부터 쉬어, 파울라.", "src": [13], "draft": true, "mark": 12}, {"kind": "say", "who": "프리마", "act": "", "text": "약초 할머니가 계시면 좋을 텐데. 섬 반대편에 약초를 캐러 가셨어요.", "src": [14], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "엿새는 걸려야 돌아오세요.", "src": [15], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "비가 오고, 웅덩이 물을 마시던 아이들……. 그래서였구나.", "src": [16], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "프리마, 저도 가 봐도 될까요? 해 볼 만한 게 있어요.", "src": [17], "draft": false}, {"kind": "say", "who": "프리마", "act": "티로를 안아 들고 고개를 끄덕인다", "text": "가요. 내가 같이 가면 쫓아내진 못할 거예요.", "src": [19], "draft": true, "mark": 18}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [20]}, {"kind": "stage", "text": "주인공, 프리마가 마을 광장에 있다.", "src": [21, 22]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [23]}, {"kind": "tell", "text": "광장 그늘에 거적을 깔고 아이들이 누워 있다. 엄마들이 포도주를 한 숟가락씩 떠 먹인다.", "src": [24], "draft": false}, {"kind": "tell", "text": "한쪽에는 바다 신께 올린 생선이 놓여 있다. 모두 할 수 있는 건 다 하는 중이다.", "src": [25], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "주인공을 막아선다", "text": "이방인이 여긴 왜 와요. 아이들이 아픈 게 안 보여요?", "src": [26], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "내가 데려왔어요. 이 사람 얘기, 한 번만 들어 봐요.", "src": [27], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "아이들이 마신 건 며칠 전 비가 고인 웅덩이 물 아닌가요?", "src": [28], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "물속에는 눈에 안 보이는 아주 작은 벌레가 살아요. 웅덩이엔 특히 많아요.", "src": [29], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그게 배 속에서 날뛰면 이렇게 앓아요. 불에 끓이면 그 벌레가 죽어요.", "src": [30], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "물을 불에 올려? 장작이 얼마나 귀한데. 겨울 땔감을 물 한 솥에 태우라고?", "src": [31], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "우물물은 신이 주신 거예요. 불에 올리면 노하세요.", "src": [33], "draft": true, "mark": 32}, {"kind": "say", "who": "마을 사람", "act": "", "text": "게다가 앓는 애한테 이방인이 먹이는 걸 어떻게 믿어요. 독이라도 타면요.", "src": [34], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "맞아요, 우물물은 귀한 거예요. 그럼 첫 바가지는 신께 올리고 나머지를 끓일게요.", "src": [36], "draft": true, "mark": 35}, {"kind": "tell", "text": "프리마가 청동 솥에 우물물을 붓고, 첫 바가지는 땅에 부어 우물 쪽으로 기울인다.", "src": [38], "draft": true, "mark": 37}, {"kind": "say", "who": "프리마", "act": "장작단을 광장 바닥에 내려놓는다", "text": "장작은 우리 집에서 대요.", "src": [39], "draft": false}, {"kind": "tell", "text": "사람들이 입을 다문다. 오두막 안주인이 직접 내놓은 장작이다.", "src": [40], "draft": false}, {"kind": "tell", "text": "물이 끓고, 솥이 식는 동안 아무도 말이 없다. 주인공이 먼저 바가지를 들어 마신다.", "src": [41], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "보세요. 독이면 이렇게 못 마셔요. 식힌 물이라 뜨겁지도 않고요.", "src": [42], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "배앓이보다 무서운 건 몸의 물이 줄줄 빠져나가는 거예요. 아이들은 작아서 금방 말라요.", "src": [43], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그래서 물을 자주 먹여야 해요. 끓여 식힌 물 한 사발에 소금 한 꼬집, 꿀 한 숟가락을 넣어서요.", "src": [44], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "물에 소금이랑 꿀을? 처음 듣는 소리네.", "src": [45], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "소금은 눈물 맛이 날 만큼만요. 한꺼번에 말고 숟가락으로 조금씩, 자주요.", "src": [46], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그리고 먹이기 전에 손을 씻어요. 변 본 뒤에도요. 그 벌레는 손에도 묻어요.", "src": [47], "draft": false}, {"kind": "tell", "text": "[여기서 물 만들기 플레이: 끓이기, 식히기, 소금 한 꼬집과 꿀 한 숟가락 재기]", "src": [48], "draft": false}, {"kind": "tell", "text": "엄마들이 바가지를 돌려 가며 손을 씻는다. 한 엄마가 소금을 집는다.", "src": [49], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "손끝으로 조금 집는다", "text": "이만큼이면 돼요?", "src": [50], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "조금만 더 적게요. 맛보세요. 눈물 맛이 나면 맞아요.", "src": [51], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "혀끝을 대 본다", "text": "……정말 눈물 맛이네.", "src": [52], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "꿀을 한 숟가락 떠 넣고 젓는다", "text": "이건 내가 할게요. 우리 애 거니까.", "src": [53], "draft": false}, {"kind": "tell", "text": "프리마가 티로의 머리를 받치고, 숟가락으로 한 모금씩 먹인다.", "src": [54], "draft": false}, {"kind": "say", "who": "티로", "act": "작은 목소리로", "text": "……달다.", "src": [55], "draft": false}, {"kind": "tell", "text": "주인공은 바가지를 든 손을 내린다. 이제 거들 일이 없다. 엄마들이 서로 봐 주며 가르쳐 준다.", "src": [56], "draft": false}, {"kind": "stage", "text": "리비아가 마을 광장으로 걸어온다.", "src": [57]}, {"kind": "tell", "text": "리비아가 말없이 물동이를 내려놓고 돌아선다. 끝내 이쪽은 보지 않는다.", "src": [58], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "머뭇거리며", "text": "……페레 씨. 아까는 말이 심했어요.", "src": [59], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "아니에요. 아이들이 낫는 게 먼저죠.", "src": [60], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "페레 씨, 우리 집 애도 좀 봐 줘요. 아직 열이 있어서요.", "src": [61], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그럼요. 같이 가요.", "src": [62], "draft": false}, {"kind": "tell", "text": "그날 밤 늦도록 광장의 솥 밑에서 불이 꺼지지 않았다. 사흘 뒤 아이들은 모두 털고 일어났다.", "src": [63], "draft": false}, {"kind": "tell", "text": "그 아침, 오두막 문 앞에 말린 생선 한 두름이 놓여 있었다.", "src": [64], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "누가 놓고 갔는지 아무도 말을 안 하네요. 받아 둬요, 페레.", "src": [65], "draft": false}], "choices": [{"text": "계속", "to": "1-080", "to_title": "섬 탐색", "condition": "", "edge": 0, "src": [68]}]}, "1-080": {"id": "1-080", "title": "섬 탐색", "has_script": true, "stamp": "4e67f3413ee4e070", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 가장 높은 바위.", "src": [2]}, {"kind": "tell", "text": "세르기우스가 아이들을 길잡이로 붙여 주었다. 섬을 익히라고.", "src": [3], "draft": false}, {"kind": "tell", "text": "물이 솟는 샘, 염소를 치는 언덕, 바위 사이에 숨은 해안 동굴. 지나는 곳마다 머릿속 지도가 채워진다.", "src": [4], "draft": false}, {"kind": "tell", "text": "[여기서 섬 탐색 플레이: 지도 채우기]", "src": [5], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "다 왔다! 여기가 섬에서 제일 높은 데야.", "src": [6], "draft": false}, {"kind": "tell", "text": "바다 건너 커다란 산이 보인다. 산허리까지 포도밭이 덮였고, 꼭대기는 하나로 둥글다.", "src": [7], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "저 산은 뭐야?", "src": [8], "draft": false}, {"kind": "say", "who": "루키우스", "act": "어깨를 으쓱한다", "text": "포도 산. 저 산 포도주가 제일 맛있대. 아래엔 큰 도시가 있고.", "src": [9], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "멋진 산이네.", "src": [10], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "내려가자! 누가 먼저 마을 어귀까지 가나 시합해!", "src": [11], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "내리막에서 뛰면 넘어진다니까.", "src": [12], "draft": false}, {"kind": "tell", "text": "[여기서 달리기 플레이: 아이들과 내리막 경주(쉬움)]", "src": [13], "draft": false}, {"kind": "stage", "text": "마르쿠스가 마을 어귀로 걸어온다.", "src": [14]}, {"kind": "tell", "text": "언덕 아래에서 날렵한 젊은이 하나가 팔짱을 끼고 서 있다.", "src": [15], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "애들이랑 노는 건 쉽지. 나랑 해 볼래?", "src": [16], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "마르쿠스 형이다. 섬에서 제일 빨라.", "src": [17], "draft": false}, {"kind": "tell", "text": "[여기서 달리기 플레이: 마르쿠스와 경주(어려움)]", "src": [18], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "이를 간다", "text": "운이 좋았어.", "src": [19], "draft": false}, {"kind": "tell", "text": "멀리서 리비아가 그 모습을 지켜보다 돌아선다.", "src": [20], "draft": false}], "choices": [{"text": "계속", "to": "1-085", "to_title": "꺾인 나뭇가지", "condition": "", "edge": 0, "src": [23]}]}, "1-085": {"id": "1-085", "title": "꺾인 나뭇가지", "has_script": true, "stamp": "28cd7b7f20144010", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 신성한 숲.", "src": [2]}, {"kind": "tell", "text": "섬 탐색을 마친 이튿날. 마을 위 비탈, 바다가 내려다보이는 작은 신전 옆 소나무 숲길을 걷는다.", "src": [3], "draft": false}, {"kind": "tell", "text": "어제 산을 오르내린 무릎이 쑤신다. 마침 쓰기 좋은 가지 하나가 늘어져 있다.", "src": [4], "draft": false}, {"kind": "say", "who": "주인공", "act": "가지를 잡아당긴다", "text": "지팡이로 딱 좋겠는데.", "src": [5], "draft": false}, {"kind": "tell", "text": "우지끈. 가지 꺾이는 소리에 숲의 새들이 한꺼번에 날아오른다.", "src": [6], "draft": false}, {"kind": "say", "who": "티로", "act": "달려온다", "text": "페레! 그거 꺾으면 안 돼! 신의 숲이야!", "src": [7], "draft": false}, {"kind": "say", "who": "주인공", "act": "가지를 든 채 굳는다", "text": "……신의 숲?", "src": [8], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "이 숲 나무는 신께 속한 거예요. 가지 하나도 함부로 못 꺾어요.", "src": [9], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "몰랐어. 정말 미안해. 도로 붙일 수는…… 없겠지?", "src": [10], "draft": false}, {"kind": "stage", "text": "마을 사람이 신성한 숲으로 걸어온다.", "src": [11]}, {"kind": "tell", "text": "소리를 들은 마을 사람들이 숲 어귀에 모여든다. 주인공의 손에 든 가지를 보고 한 걸음씩 물러선다.", "src": [12], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "신의 숲 가지를 꺾었어. 이방인이라 그걸 몰랐던 게지.", "src": [13], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "바다의 신 넵투누스께서 노하시면 우리 그물까지 텅 비게 돼.", "src": [14], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "조심스럽게", "text": "페레 씨가 나쁜 분은 아니지만, 신은 사정을 안 봐줘요.", "src": [15], "draft": false}, {"kind": "tell", "text": "얼마 전 끓인 물로 가까워졌던 이들도 이번에는 말없이 뒤로 물러선다.", "src": [16], "draft": false}, {"kind": "stage", "text": "프리마가 신성한 숲으로 걸어온다.", "src": [17]}, {"kind": "say", "who": "프리마", "act": "", "text": "몰라서 한 일을 신께서도 아시겠죠. 신전지기 어르신께 직접 여쭤 봐요.", "src": [18], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [19]}, {"kind": "stage", "text": "주인공이 작은 신전에 있다.", "src": [20]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [21]}, {"kind": "tell", "text": "작은 신전. 바다가 내려다보이는 돌제단 앞에서 늙은 신전지기 바르바투스가 향을 피운다.", "src": [22], "draft": false}, {"kind": "tell", "text": "얼굴은 엄숙한데 수염에 보리빵 부스러기가 붙어 있다.", "src": [23], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "어르신, 제가 몰라서 숲의 가지를 꺾었습니다. 어떻게 사죄하면 됩니까?", "src": [24], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "엄숙하게", "text": "으흠. 신의 숲의 가지를 꺾은 죄는 가볍지 않도다.", "src": [25], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "그러나 몰랐던 자를 가볍게 다스리는 것이 넵투누스 신의 뜻이니라.", "src": [26], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "네 가지를 모두 해내거라. 순서는 상관없으나 하나라도 빠지면 용서는 없느니라.", "src": [27], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "첫째, 시장에서 꿀과 포도주와 보리과자를 얻어 와 제단에 올려라.", "src": [28], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "둘째, 신전 마당을 쓸고, 우물물로 제단을 닦고, 꺼진 불을 다시 피워라.", "src": [29], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "셋째, 해 뜨기 전 모래밭에서 바닷물로 몸을 씻어라.", "src": [30], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "넷째……. (헛기침) 신께서 간절히 바라시는 것이 하나 더 있느니라.", "src": [31], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "바위틈에서 잡은 싱싱한 문어 한 마리. 삶아서 올리브기름을 곁들여…… 아니, 그대로 바치거라.", "src": [32], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "……신께서 문어를 드십니까?", "src": [33], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "드시고말고! 신의 몫을 먼저 맛보는 것은 신전지기의 소임이니라!", "src": [34], "draft": false}, {"kind": "tell", "text": "[여기서 제물 모으기 플레이: 시장 거리를 돌며 일을 거들고 꿀·포도주·보리과자 얻기]", "src": [35], "draft": false}, {"kind": "tell", "text": "[여기서 신전 일손 플레이: 마당 쓸기, 우물물로 제단 닦기, 부싯돌로 불 피우기]", "src": [36], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [37]}, {"kind": "stage", "text": "주인공이 바닷가 모래밭에 있다.", "src": [38]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [39]}, {"kind": "tell", "text": "해 뜨기 전, 아직 푸른 모래밭. 바닷물이 발목을 적신다.", "src": [40], "draft": false}, {"kind": "tell", "text": "[여기서 새벽 목욕 플레이: 해 뜨기 전 바닷물로 몸 씻기]", "src": [41], "draft": false}, {"kind": "tell", "text": "[여기서 문어 잡기 플레이: 바위틈에서 문어 한 마리]", "src": [42], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [43]}, {"kind": "stage", "text": "주인공이 작은 신전에 있다.", "src": [44]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [45]}, {"kind": "tell", "text": "네 가지를 모두 마친 날. 주인공은 제물과 문어 접시를 들고 다시 돌제단 앞에 선다.", "src": [46], "draft": false}, {"kind": "stage", "text": "티로가 작은 신전으로 걸어온다.", "src": [47]}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "제물을 하나씩 살핀다", "text": "꿀, 포도주, 보리과자. 제단은 반짝이고 불씨도 살아 있구나.", "src": [48], "draft": false}, {"kind": "tell", "text": "주인공이 문어 접시를 제단에 올린다. 신전지기가 엄숙하게 눈을 감고 기도한다.", "src": [49], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "", "text": "넵투누스 신이시여, 이 이방인의 죄를 …… (한쪽 눈을 슬쩍 뜬다) 맛있어 보이는구나.", "src": [50], "draft": false}, {"kind": "tell", "text": "주인공이 시선을 돌린 사이, 접시의 문어 다리가 하나둘 사라진다.", "src": [51], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "어? 할아버지 입에 문어 다리가 있어!", "src": [52], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "우물거리며", "text": "신께서 이 늙은이의 입을 빌려 드신 것이니라.", "src": [53], "draft": false}, {"kind": "say", "who": "바르바투스(신전지기)", "act": "헛기침하며 허리를 편다", "text": "흠흠. 신께서 용서하셨노라. 이만 돌아가거라.", "src": [54], "draft": false}, {"kind": "tell", "text": "문어는 신전지기의 배로 갔지만, 용서는 용서였다. 아이들은 두고두고 신전지기를 놀려 댔다.", "src": [55], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "신전지기께서 용서하셨다는군. 이제 한시름 놓았네.", "src": [56], "draft": false}], "choices": [{"text": "계속", "to": "1-090", "to_title": "다시 쉰 숨", "condition": "", "edge": 0, "src": [59]}]}, "1-090": {"id": "1-090", "title": "다시 쉰 숨", "has_script": true, "stamp": "9a9cb333e8805722", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 리쿠스가 고치는 배.", "src": [2]}, {"kind": "tell", "text": "섬에 온 지 한 달 가까이. 늙은 뱃사공 리쿠스가 송진 묻은 손으로 고친 배 밑을 두드린다.", "src": [3], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "", "text": "이 소리 좀 들어 봐. 속이 꽉 찼어. 이 배는 나보다 오래 살겠군.", "src": [4], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "밧줄을 건넨다", "text": "구경만 할 텐가, 이방인? 놓치지 말게. 파도가 변덕이야.", "src": [5], "draft": false}, {"kind": "tell", "text": "어부들이 배를 밀어 물에 내린다. 그때 큰 물마루가 밀려든다.", "src": [6], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "영감님, 발! 그물 조심해요!", "src": [7], "draft": false}, {"kind": "tell", "text": "리쿠스의 발목에 그물이 감긴다. 노인이 물속으로 끌려 들어간다.", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "리쿠스 씨!", "src": [9], "draft": false}, {"kind": "tell", "text": "어부들이 그물을 끊고 노인을 끌어내기까지 한참 걸렸다.", "src": [10], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [11]}, {"kind": "stage", "text": "주인공, 리쿠스, 마르쿠스, 세르기우스, 루키우스, 티로, 파울라가 바닷가 모래밭에 있다.", "src": [12, 13, 14, 15, 16, 17, 18]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [19]}, {"kind": "tell", "text": "모래 위에 눕힌 리쿠스의 입술이 파랗다. 가슴은 꿈쩍도 하지 않는다.", "src": [20], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "고개를 떨군다", "text": "숨이 없어. 바다가 데려갔어.", "src": [21], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "해 지기 전에 바다 쪽으로 눕혀야 해. 입에 소금 한 줌 물리고.", "src": [22], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "잠깐만요. 아직 늦지 않았을 수도 있어요.", "src": [23], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "앞을 막아선다", "text": "죽은 몸에 손대지 마. 부정 타.", "src": [24], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "장례 풍습을 막으려는 게 아니에요. 그건 그대로 치르세요.", "src": [25], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "다만 숨길이 막혀 멈춘 거라면 가슴 속 북을 다시 울릴 수 있어요.", "src": [26], "draft": false}, {"kind": "tell", "text": "마르쿠스가 주인공의 어깨를 밀치려는 순간, 억센 손이 그의 팔목을 잡는다.", "src": [27], "draft": false}, {"kind": "tell", "text": "세르기우스다. 아무 말 없이 마르쿠스의 팔을 내리고 주인공에게 턱짓을 한다.", "src": [28], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "이를 악문다", "text": "……맘대로 해. 탈 나도 내 탓 아니야.", "src": [29], "draft": false}, {"kind": "say", "who": "주인공", "act": "노인 곁에 무릎을 꿇는다", "text": "먼저 고개를 젖혀서 숨길을 열어요.", "src": [30], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그다음 가슴 한가운데를 두 손으로, 빠르고 세게. 서른 번.", "src": [31], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "박자가 필요해요. 루키우스, 그물 노래 불러 줄래? 크게!", "src": [32], "draft": false}, {"kind": "say", "who": "루키우스", "act": "눈물을 훔친다", "text": "응! 하나, 둘, 당겨라! 하나, 둘, 당겨라!", "src": [33], "draft": false}, {"kind": "tell", "text": "티로와 파울라도 따라 부른다. 노래가 모래밭에 울린다.", "src": [34], "draft": false}, {"kind": "tell", "text": "[여기서 가슴 누르기 플레이: 노래 박자에 맞춰 서른 번 누르고, 숨 두 번 불어넣기]", "src": [35], "draft": false}, {"kind": "say", "who": "주인공", "act": "숨을 불어넣는다", "text": "……한 번 더. 다시 서른 번!", "src": [36], "draft": false}, {"kind": "tell", "text": "노래가 세 번째로 돌아갈 즈음, 리쿠스가 물을 토하며 크게 숨을 들이켠다.", "src": [37], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "콜록거린다", "text": "……으, 짜다. 내가 바다를 통째로 마셨나.", "src": [38], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "", "text": "저승 뱃사공이 날 보더니 그러더군. 자네는 아직 노가 남았다고.", "src": [39], "draft": false}, {"kind": "tell", "text": "사람들이 숨을 삼킨다. 몇몇이 한 걸음, 두 걸음 뒤로 물러선다.", "src": [40], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "속삭인다", "text": "죽은 사람을 되살렸어……. 사람이 아니야.", "src": [41], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "가까이 가지 마. 저 손에 닿으면 우리도…….", "src": [42], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "마법이 아니에요. 숨길이 막혔던 것뿐이고, 누구나 배우면 할 수 있어요.", "src": [43], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "바다에서 일하는 분들이 제일 먼저 알아야 하는 거예요. 같이 해 봐요.", "src": [44], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "머뭇거리다 다가온다", "text": "페레, 나도 가르쳐 줘. 우리 형도 바다에서…….", "src": [45], "draft": false}, {"kind": "tell", "text": "주인공은 그물 뭉치를 사람 가슴 높이로 말아 모래 위에 놓는다.", "src": [46], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "손바닥 밑동을 대고 팔을 곧게 펴요. 팔힘 말고 몸무게로 눌러요.", "src": [47], "draft": false}, {"kind": "tell", "text": "어부들이 하나둘 무릎을 꿇는다. 루키우스가 박자를 잡는다.", "src": [48], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "힘들면 바꿔서 해요. 혼자 하는 게 아니라 돌아가며 하는 거예요.", "src": [49], "draft": false}, {"kind": "tell", "text": "마르쿠스는 멀찍이 팔짱을 낀 채 서 있다. 끝내 다가오지 않는다.", "src": [50], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "코웃음", "text": "우연히 물을 토한 거겠지.", "src": [51], "draft": false}, {"kind": "tell", "text": "마르쿠스가 돌아선다. 그물을 안은 리비아는 눈이 마주치기 전에 고개를 돌린다.", "src": [52], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "모래에 앉은 채", "text": "이봐, 페레라고 했나. 은혜는 배로 갚지.", "src": [53], "draft": false}, {"kind": "say", "who": "리쿠스", "act": "", "text": "배 고칠 일손이 모자랄 때 부를 테니, 도망갈 생각은 말게.", "src": [54], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "어부들, 다 배워 둬라. 바다에 나가는 놈은 전부.", "src": [55], "draft": false}, {"kind": "tell", "text": "어부 둘이 그물 뭉치를 사이에 두고 서로 자세를 고쳐 준다. 주인공은 말없이 지켜만 본다.", "src": [56], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "박자 맞춰 숨 쉬니 그물 당길 때도 덜 힘들겠는걸.", "src": [57], "draft": false}, {"kind": "tell", "text": "해가 기울기 시작한다. 모래밭에서 그물 노래가 좀처럼 그치지 않는다.", "src": [58], "draft": false}], "choices": [{"text": "계속", "to": "1-100", "to_title": "사라진 아이 찾기", "condition": "", "edge": 0, "src": [61]}]}, "1-100": {"id": "1-100", "title": "사라진 아이 찾기", "has_script": true, "stamp": "66841e20529ffabd", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 밀물 바위.", "src": [2]}, {"kind": "tell", "text": "해 질 녘. 가장 어린 티로가 돌아오지 않았다.", "src": [3], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "티로가 보물 찾는다고 동굴 쪽으로 갔어요. 말렸는데…….", "src": [4], "draft": false}, {"kind": "tell", "text": "주인공은 횃불을 들고 산과 바닷가를 뒤진다. 시간이 갈수록 물이 차오른다.", "src": [5], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "루키우스, 넌 돌아가. 위험해.", "src": [6], "draft": false}, {"kind": "say", "who": "루키우스", "act": "횃불을 꼭 쥔다", "text": "티로는 내 동생 같은 애야. 내가 같이 가야 해.", "src": [7], "draft": false}, {"kind": "tell", "text": "여덟 살 아이의 목소리가 떨린다. 하지만 발은 멈추지 않는다.", "src": [8], "draft": false}, {"kind": "tell", "text": "[여기서 징검바위 플레이: 차오르는 물 위 징검바위를 밟아 건넌다. 물에 빠져도 무릎까지 — 느려질 뿐]", "src": [10], "draft": true, "mark": 9}, {"kind": "tell", "text": "[여기서 사람 찾기 플레이: 발자국·소리·갈림길 세 곳. 잘못 골라도 돌아와 다시 고른다]", "src": [11], "draft": false}, {"kind": "tell", "text": "동굴 깊은 곳. 밀물에 갇힌 바위 위에서 티로가 울고 있다.", "src": [12], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "티로! 거기 있어. 움직이지 마!", "src": [13], "draft": false}, {"kind": "tell", "text": "주인공은 물살을 헤치고 아이를 업는다. 티로가 목에 매달려 목걸이를 만지작거린다.", "src": [14], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "이거 진짜 보물이야? 반짝반짝해.", "src": [15], "draft": false}, {"kind": "say", "who": "주인공", "act": "웃는다", "text": "보물보다 네가 더 귀해. 꽉 잡아.", "src": [16], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [17]}, {"kind": "stage", "text": "주인공이 마을 어귀에 있다.", "src": [18]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [19]}, {"kind": "tell", "text": "마을 어귀에서 리비아가 기다리고 있다. 리비아가 달려와 티로를 끌어안는다.", "src": [20], "draft": false}, {"kind": "tell", "text": "그리고 처음으로, 주인공을 똑바로 본다.", "src": [21], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "고마워요.", "src": [22], "draft": false}, {"kind": "tell", "text": "허리가 굽은 노파가 다가와 티로의 상처에 약초를 바른다. 카밀라다.", "src": [23], "draft": false}, {"kind": "say", "who": "카밀라", "act": "", "text": "…….", "src": [24], "draft": false}, {"kind": "tell", "text": "카밀라는 처음 보는 주인공을 말없이 오래 바라본다.", "src": [25], "draft": false}], "choices": [{"text": "계속", "to": "1-110", "to_title": "글자 가르치기", "condition": "", "edge": 0, "src": [28]}]}, "1-110": {"id": "1-110", "title": "글자 가르치기", "has_script": true, "stamp": "133d354f77aaee90", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 글자 바위.", "src": [2]}, {"kind": "tell", "text": "티로를 구한 뒤 며칠. 주인공이 모래에 글자를 끄적이고 있으면 루키우스가 어김없이 옆에 앉는다.", "src": [3], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "그거 뭐야? 또 그 이상한 그림이야?", "src": [4], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "글자야. 이 동네 글자도 같이 익혀 볼래?", "src": [5], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "해 볼래! 이건 뭐라고 읽어?", "src": [6], "draft": false}, {"kind": "tell", "text": "[여기서 따라 쓰기: 루키우스가 막대로 모래에 글자를 따라 쓴다]", "src": [7], "draft": false}, {"kind": "tell", "text": "[여기서 모래 글자 플레이: 본을 써 주고, 루키우스가 뒤집어 쓴 글자를 찾아 고쳐 준다]", "src": [9], "draft": true, "mark": 8}, {"kind": "say", "who": "주인공", "act": "", "text": "거의 맞았어. 여기 획 하나만 더.", "src": [10], "draft": false}, {"kind": "say", "who": "루키우스", "act": "막대를 고쳐 쥔다", "text": "이렇게? ……됐다!", "src": [11], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "잘했어. 기억하고 싶은 건 적어 두면 남아. 사람은 잊어도 글자는 안 잊거든.", "src": [12], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "사람은 잊어도…… 글자는 안 잊어.", "src": [13], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "그럼 아저씨 이야기도 적어 둘래. 저 바위에.", "src": [14], "draft": false}, {"kind": "tell", "text": "루키우스가 바위에 무언가를 긁기 시작한다. 그날부터 바위의 글자는 날마다 늘어난다.", "src": [15], "draft": false}], "choices": [{"text": "계속", "to": "1-120", "to_title": "고인 물과 열병", "condition": "", "edge": 0, "src": [18]}]}, "1-120": {"id": "1-120", "title": "고인 물과 열병", "has_script": true, "stamp": "70c8fddcc3858b8b", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 마을 광장.", "src": [2]}, {"kind": "tell", "text": "섬에 온 지 두 달째. 한여름 밤마다 모기가 구름처럼 떠다닌다.", "src": [3], "draft": false}, {"kind": "tell", "text": "열이 올라 앓아눕는 사람이 하루가 다르게 늘어난다.", "src": [4], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "또 한 집이 앓아누웠어. 이번엔 건넛집 아이래.", "src": [5], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "밤공기가 나쁜 거야. 바닷바람이 뭘 싣고 올라오는 게지.", "src": [6], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "신의 노여움이야. 올해는 바친 게 모자랐어.", "src": [7], "draft": false}, {"kind": "tell", "text": "문마다 마른 풀을 태워 연기를 피운다. 담 밑 금 간 항아리엔 초록 물이 그대로다.", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "바치는 것도 풀 연기도 그대로 하세요. 연기는 모기를 쫓는 데 도움이 돼요.", "src": [9], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그런데 한 가지만 같이 봐 주시겠어요? 가룸 항아리 터에서요.", "src": [10], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [11]}, {"kind": "stage", "text": "주인공, 마을 사람, 티로, 파울라, 마르쿠스, 리비아가 가룸 항아리 터에 있다.", "src": [12, 13, 14, 15, 16, 17]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [18]}, {"kind": "tell", "text": "터 구석에 깨진 항아리들이 쌓여 있다. 안에 고인 빗물이 초록빛으로 탁하다.", "src": [19], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "이 물을 하얀 사발에 떠 볼게요. 햇빛에 비춰 보세요.", "src": [20], "draft": false}, {"kind": "tell", "text": "사발 속 물에서 바늘 같은 것들이 꼼지락거리며 오르내린다.", "src": [21], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "으악! 벌레야! 물속에 벌레가 살아!", "src": [22], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "소리 지르지 마, 티로. ……정말 꿈틀거려.", "src": [23], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "장구벌레잖아. 어디든 있는 건데 그게 뭐 어떻다고.", "src": [24], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "이게 며칠 뒤 날개가 돋아서, 밤마다 귓가를 도는 모기가 돼요.", "src": [25], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "제가 살던 곳에서는 그 모기가 열병을 옮긴다고 알아요.", "src": [26], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "나쁜 공기도 신의 벌도 아니라는 건가?", "src": [27], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그 뜻이 아니에요. 두 분 말씀이 맞을 수도 있고요. 이것도 같이 해 보자는 거예요.", "src": [28], "draft": false}, {"kind": "stage", "text": "카밀라가 가룸 항아리 터로 걸어온다.", "src": [29]}, {"kind": "tell", "text": "사람들이 웅성거린다. 사발을 들여다보는 이들 사이로 카밀라가 지팡이를 짚고 온다.", "src": [30], "draft": false}, {"kind": "tell", "text": "카밀라는 말없이 사발 속 벌레를 한참 들여다본다.", "src": [31], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "할머니 약초는 앓는 사람을 낫게 하죠. 저는 앓는 사람이 안 생기게 하고 싶은 거고요.", "src": [32], "draft": false}, {"kind": "say", "who": "카밀라", "act": "사발을 본 채", "text": "……둘 다 있어야지.", "src": [33], "draft": false}, {"kind": "tell", "text": "카밀라가 말린 풀 한 줌을 연기 피우는 화로에 얹는다. 매캐한 냄새가 퍼진다.", "src": [34], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "깨진 항아리도 쓸 데가 있어. 엎어 두면 나중에 쓰질 못하잖아.", "src": [35], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "입구를 아래로 엎어 쌓아 두면 돼요. 비가 와도 물이 안 고여요.", "src": [36], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "팔짱을 낀다", "text": "벌레 하나로 열병을 막는다고? 그게 되면 내가 무릎을 꿇지.", "src": [37], "draft": false}, {"kind": "tell", "text": "마르쿠스는 구경만 한다. 땅 파는 일엔 끝내 손을 대지 않는다.", "src": [38], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "못 메우는 웅덩이엔 샘에서 작은 물고기를 풀어요. 장구벌레를 먹거든요.", "src": [39], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "리비아, 그물에 아마천을 덧대면 모기가 못 들어올까요?", "src": [40], "draft": false}, {"kind": "say", "who": "리비아", "act": "그물을 만져 본다", "text": "올이 성기면 들어와요. 천을 두 겹으로.", "src": [41], "draft": false}, {"kind": "tell", "text": "리비아는 웃지 않는다. 대신 그물 귀퉁이를 직접 당겨 묶어 준다.", "src": [42], "draft": false}, {"kind": "tell", "text": "[여기서 마을 일손 플레이: 항아리 엎기, 웅덩이 메우기, 샘에서 물고기 떠 와 풀기, 모기장 치기]", "src": [44], "draft": true, "mark": 43}, {"kind": "tell", "text": "이튿날부터 마을 전체가 움직인다. 아이들은 돌을 나르고, 어른들은 항아리를 엎고 웅덩이를 메운다.", "src": [45], "draft": false}, {"kind": "tell", "text": "빗물 통에는 뚜껑을 덮고, 잠자리마다 그물과 천으로 모기장을 친다.", "src": [46], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [47]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [48]}, {"kind": "tell", "text": "열흘 뒤. 밤마다 귀를 때리던 모기 소리가 눈에 띄게 줄었다.", "src": [49], "draft": false}, {"kind": "tell", "text": "앓아눕던 사람들은 일어나 앉고, 새로 앓는 사람은 없다.", "src": [50], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "올여름은 밤에 잠을 자네. 아이들 열도 내렸고.", "src": [51], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "우리 페레가 알려 준 대로 하니 되는구먼. 우리 페레 덕이야.", "src": [52], "draft": false}, {"kind": "tell", "text": "처음으로 누군가 그를 '우리 페레'라고 불렀다. 주인공은 대답을 찾지 못하고 웃는다.", "src": [53], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "……아버지, 이런 뜻이었어요?", "src": [54], "draft": false}, {"kind": "tell", "text": "마을 사람들은 벌써 다음 집의 항아리를 엎으러 간다. 아무도 시키지 않았는데도.", "src": [55], "draft": false}], "choices": [{"text": "계속", "to": "1-125", "to_title": "운동 마당", "condition": "", "edge": 0, "src": [58]}]}, "1-125": {"id": "1-125", "title": "운동 마당", "has_script": true, "stamp": "b3922d74be9c29f5", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 마을 광장.", "src": [3]}, {"kind": "tell", "text": "열병이 물러가고 며칠 뒤. 광장 남서쪽 공터에서 쿵, 쿵 소리가 난다.", "src": [5], "draft": true}, {"kind": "tell", "text": "마르쿠스가 둥근 돌을 들었다 내려놓는다. 어부들이 둘러서서 구경한다.", "src": [7], "draft": true, "mark": 6}, {"kind": "say", "who": "마을 사람", "act": "", "text": "역시 마르쿠스야. 저 돌을 열 번이나 드네.", "src": [9], "draft": true, "mark": 8}, {"kind": "say", "who": "마르쿠스", "act": "돌을 내려놓는다", "text": "구경 왔냐, 이방인. 너도 들어 보든가.", "src": [11], "draft": true, "mark": 10}, {"kind": "say", "who": "주인공", "act": "돌을 내려다본다", "text": "들어 볼게. 대신 나는 좀 다르게 들어.", "src": [13], "draft": true, "mark": 12}, {"kind": "tell", "text": "주인공이 허리를 곧게 세운 채 무릎을 굽혀 돌을 끌어안는다.", "src": [15], "draft": true, "mark": 14}, {"kind": "tell", "text": "그리고 다리로 밀어 올린다.", "src": [17], "draft": true, "mark": 16}, {"kind": "say", "who": "마을 사람", "act": "", "text": "허리를 안 굽히네? 우린 다들 허리로 드는데.", "src": [19], "draft": true, "mark": 18}, {"kind": "say", "who": "주인공", "act": "", "text": "그래서 다들 허리가 아프죠. 그물 당기는 날 밤마다.", "src": [21], "draft": true, "mark": 20}, {"kind": "say", "who": "마을 사람", "act": "허리를 짚는다", "text": "……그건 맞아. 아침마다 끙끙대.", "src": [23], "draft": true, "mark": 22}, {"kind": "say", "who": "주인공", "act": "", "text": "허리는 곧게, 힘은 다리로. 무거운 그물도 똑같아요.", "src": [25], "draft": true, "mark": 24}, {"kind": "say", "who": "마르쿠스", "act": "코웃음", "text": "돌 하나 드는 데 말이 많군.", "src": [27], "draft": true, "mark": 26}, {"kind": "tell", "text": "마르쿠스는 다시 돌을 든다. 허리를 굽힌 채다. 얼굴이 살짝 일그러진다.", "src": [29], "draft": true, "mark": 28}, {"kind": "stage", "text": "티로, 루키우스, 파울라가 마을 광장으로 걸어온다.", "src": [31, 33, 35]}, {"kind": "say", "who": "티로", "act": "달려온다", "text": "페레! 나도 할래! 나도 돌 들래!", "src": [37], "draft": true, "mark": 36}, {"kind": "say", "who": "주인공", "act": "", "text": "티로는 돌 말고 나뭇가지부터.", "src": [39], "draft": true, "mark": 38}, {"kind": "tell", "text": "공터 가장자리 올리브 나무에 굵은 가지 하나가 옆으로 뻗어 있다.", "src": [41], "draft": true, "mark": 40}, {"kind": "say", "who": "주인공", "act": "", "text": "저 가지에 매달려서 몸을 끌어 올리는 거야.", "src": [43], "draft": true, "mark": 42}, {"kind": "say", "who": "주인공", "act": "", "text": "턱이 가지를 넘으면 한 번.", "src": [45], "draft": true, "mark": 44}, {"kind": "say", "who": "루키우스", "act": "가지에 매달린다", "text": "으으…… 하나!", "src": [47], "draft": true, "mark": 46}, {"kind": "say", "who": "파울라", "act": "", "text": "통나무를 눕혀 두면 앉아서 할 것도 있겠어요.", "src": [49], "draft": true, "mark": 48}, {"kind": "say", "who": "주인공", "act": "", "text": "맞아. 통나무에 누워 돌을 밀어 올리면 팔이 세져.", "src": [51], "draft": true, "mark": 50}, {"kind": "tell", "text": "[여기서 운동 마당 플레이: 돌 들기, 가지 턱걸이, 통나무 벤치]", "src": [53], "draft": true, "mark": 52}, {"kind": "tell", "text": "어부들이 하나둘 돌 앞에 선다. 서로 허리를 봐 주며 다리로 든다.", "src": [55], "draft": true, "mark": 54}, {"kind": "say", "who": "마을 사람", "act": "옆 사람 허리를 툭 친다", "text": "곧게! 페레가 다리로 들랬잖아.", "src": [57], "draft": true, "mark": 56}, {"kind": "say", "who": "마을 사람", "act": "", "text": "이렇게 들면 내일 아침엔 덜 끙끙대려나.", "src": [59], "draft": true, "mark": 58}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "대장간 쇠막대랑 밧줄이 있으면 더 좋은 걸 만들 텐데.", "src": [61], "draft": true, "mark": 60}, {"kind": "say", "who": "주인공", "act": "", "text": "돈이 모이면 하나씩 늘려 가요. 이 공터는 운동 마당이에요.", "src": [63], "draft": true, "mark": 62}, {"kind": "say", "who": "마을 사람", "act": "", "text": "운동 마당이라. 이름 한번 거창하네.", "src": [65], "draft": true, "mark": 64}, {"kind": "say", "who": "마을 사람", "act": "웃는다", "text": "좋아, 통나무는 내가 대지.", "src": [67], "draft": true, "mark": 66}, {"kind": "tell", "text": "마르쿠스는 끝까지 허리를 굽혀 돌을 든다.", "src": [69], "draft": true, "mark": 68}, {"kind": "tell", "text": "그러다 아무도 안 볼 때 한 번, 슬쩍 무릎을 굽혀 본다.", "src": [71], "draft": true, "mark": 70}, {"kind": "say", "who": "마르쿠스", "act": "눈이 마주치자 돌을 내려놓는다", "text": "……돌이 가벼워서 그래.", "src": [73], "draft": true, "mark": 72}, {"kind": "tell", "text": "아이들은 해가 질 때까지 올리브 가지에 매달려 숫자를 센다.", "src": [75], "draft": true, "mark": 74}], "choices": [{"text": "계속", "to": "1-130", "to_title": "상인의 거짓말", "condition": "", "edge": 0, "src": [78]}]}, "1-130": {"id": "1-130", "title": "상인의 거짓말", "has_script": true, "stamp": "18c3ecfc79b3f753", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 장터.", "src": [2]}, {"kind": "tell", "text": "상인이 배를 대고 장을 펼쳤다. 섬사람들은 일 년 동안 말린 생선과 젓갈을 내놓고, 소금과 천과 도구를 산다.", "src": [3], "draft": false}, {"kind": "say", "who": "테르티우스(상인)", "act": "", "text": "자, 생선 열 두름에 소금 세 자루하고 반! 아니지, 천을 끼우면 두 자루하고 세 뼘! 셈은 내가 해 드리지.", "src": [4], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "그게…… 많은 건가, 적은 건가?", "src": [5], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "일부러 값을 복잡하게 부르고 있다.", "src": [6], "draft": false}, {"kind": "tell", "text": "[여기서 셈 한 판: 바꾸는 값을 암산으로 바로잡는다]", "src": [7], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "잠깐만요. 처음에 부른 값대로면 소금이 한 자루 반 모자라요.", "src": [8], "draft": false}, {"kind": "say", "who": "테르티우스(상인)", "act": "얼굴을 붉힌다", "text": "크흠. 내가 셈을 잘못했나. ……다시 매기지.", "src": [9], "draft": false}, {"kind": "tell", "text": "마을 사람들이 주인공의 등을 두드린다.", "src": [10], "draft": false}, {"kind": "say", "who": "세르기우스", "act": "", "text": "우리 섬에 쓸 만한 사람이 왔군.", "src": [11], "draft": false}, {"kind": "tell", "text": "떠나기 전, 테르티우스가 퉁명스럽게 한마디 던진다.", "src": [12], "draft": false}, {"kind": "say", "who": "테르티우스(상인)", "act": "", "text": "건너편 도시에서 곧 불의 신 축제가 열린다. 생선 팔 생각 있으면 그때 와라. 사람이 미어터지니까.", "src": [13], "draft": false}, {"kind": "tell", "text": "섬사람들의 눈이 반짝인다.", "src": [14], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [15]}, {"kind": "stage", "text": "주인공이 오두막 앞에 있다.", "src": [16]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [17]}, {"kind": "tell", "text": "그날 밤. 리비아가 오두막 옆에서 그물을 손질하고 있다.", "src": [18], "draft": false}, {"kind": "say", "who": "리비아", "act": "그물에서 눈을 떼지 않고", "text": "당신은 이상해요. 아는 게 너무 많아요. 우리랑 달라요.", "src": [19], "draft": false}, {"kind": "tell", "text": "칭찬인지 경계인지 알 수 없는 말이다.", "src": [20], "draft": false}], "choices": [{"text": "계속", "to": "1-140", "to_title": "도둑 잡기", "condition": "", "edge": 0, "src": [23]}]}, "1-140": {"id": "1-140", "title": "도둑 잡기", "has_script": true, "stamp": "ed3c25f0733a30e6", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 마을 창고.", "src": [2]}, {"kind": "tell", "text": "며칠 뒤, 마을 창고가 털렸다. 겨울을 날 곡식과 말린 생선이 사라졌다.", "src": [3], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "저 이방인이 온 뒤로 이상한 일만 생겨.", "src": [4], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "그러고 보니……. 저 사람 오고 나서지.", "src": [5], "draft": false}, {"kind": "tell", "text": "세르기우스는 말이 없다.", "src": [6], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "제가 아니에요. 오늘 밤, 제가 창고를 지키겠습니다.", "src": [7], "draft": false}, {"kind": "stage", "text": "화면이 어두워진다.", "src": [8]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [9]}, {"kind": "tell", "text": "밤. 달이 밝다. 창고 뒤에서 그림자 하나가 움직인다.", "src": [10], "draft": false}, {"kind": "tell", "text": "[여기서 잠입 플레이: 덤불과 바위 뒤에 숨고, 개 짖는 소리를 피하고, 달빛을 가린다]", "src": [11], "draft": false}, {"kind": "tell", "text": "그림자는 세르기우스의 오두막으로 숨어든다. 노리는 것은 잠든 자리에 둔 목걸이다.", "src": [12], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "거기까지야!", "src": [13], "draft": false}, {"kind": "tell", "text": "도둑은 목걸이를 놓치고 달아나다 붙잡힌다. 섬사람이 아닌 낯선 얼굴이다.", "src": [14], "draft": false}, {"kind": "say", "who": "정찰꾼", "act": "", "text": "놔, 놔! ……드라콘 두목이 시켰다. 이 섬에 빛나는 붉은 돌을 가진 놈이 있다길래.", "src": [15], "draft": false}, {"kind": "say", "who": "주인공", "act": "목걸이를 내려다본다", "text": "……이게, 여기서는 보물이구나.", "src": [16], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "고개를 돌린다", "text": "…….", "src": [17], "draft": false}, {"kind": "tell", "text": "누명은 벗었다. 마르쿠스는 사과하지 않는다.", "src": [18], "draft": false}, {"kind": "tell", "text": "대신 리비아가 처음으로 먼저 말을 건다.", "src": [19], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "무서웠겠어요. 그 목걸이, 소중한 거죠?", "src": [20], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "아버지가 늘 차고 다니던 거예요. 마지막에 저한테 주셨어요.", "src": [21], "draft": false}, {"kind": "tell", "text": "리비아는 끝까지 듣는다.", "src": [22], "draft": false}], "choices": [{"text": "계속", "to": "1-150", "to_title": "해적의 습격", "condition": "", "edge": 0, "src": [25]}]}, "1-150": {"id": "1-150", "title": "해적의 습격", "has_script": true, "stamp": "2a3848350e909adb", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 바닷가 모래밭.", "src": [2]}, {"kind": "tell", "text": "새벽. 배 두 척이 마을 앞바다에 닿는다.", "src": [3], "draft": false}, {"kind": "say", "who": "마을 사람", "act": "", "text": "해적이다! 해적이 왔다!", "src": [4], "draft": false}, {"kind": "say", "who": "보초", "act": "", "text": "붉은 돌을 가진 이방인, 어디서 자는지 대라!", "src": [5], "draft": false}, {"kind": "tell", "text": "해적들이 생선과 곡식을 빼앗고, 사람 하나를 끌고 간다.", "src": [6], "draft": false}, {"kind": "tell", "text": "모래밭에 끌어올려 둔 세르기우스의 배 밑창이 도끼에 찍혀 갈라진다.", "src": [8], "draft": true, "mark": 7}, {"kind": "say", "who": "루키우스", "act": "", "text": "놔! 놓으란 말이야!", "src": [9], "draft": false}, {"kind": "tell", "text": "끌려간 것은 루키우스다.", "src": [10], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "루키우스!", "src": [11], "draft": false}, {"kind": "tell", "text": "해적의 배는 바위 해안 쪽으로 사라진다. 섬 탐색 때 보아 둔 그 해안 동굴 쪽이다.", "src": [12], "draft": false}, {"kind": "stage", "text": "마르쿠스가 바닷가 모래밭으로 걸어온다.", "src": [13]}, {"kind": "say", "who": "마르쿠스", "act": "작살을 든다", "text": "애를 데려갔어. 너 혼자 보낼 순 없지.", "src": [14], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "……같이 가자.", "src": [15], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "착각하지 마. 너 때문에 가는 거 아니야.", "src": [16], "draft": false}], "choices": [{"text": "계속", "to": "1-160", "to_title": "해적 소굴", "condition": "", "edge": 0, "src": [19]}]}, "1-160": {"id": "1-160", "title": "해적 소굴", "has_script": true, "stamp": "6baf3e04081576e6", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 동굴 입구.", "src": [3]}, {"kind": "tell", "text": "섬 탐색 때 아이들과 찾았던 그 해안 동굴. 안은 조용하다.", "src": [5], "draft": true}, {"kind": "say", "who": "마르쿠스", "act": "속삭인다", "text": "아무도 없잖아. 잘못 온 거 아니야?", "src": [7], "draft": true, "mark": 6}, {"kind": "tell", "text": "안쪽 바위벽 어딘가에서 웅성거림이 새어 나온다.", "src": [9], "draft": true, "mark": 8}, {"kind": "say", "who": "주인공", "act": "", "text": "잠시만, 저 틈에서 뭔가 소리가 나는 것 같은데?", "src": [11], "draft": true, "mark": 10}, {"kind": "tell", "text": "몸을 숙여야 지날 좁은 틈. 그 너머에서 횃불 빛이 어른거린다.", "src": [13], "draft": true, "mark": 12}, {"kind": "say", "who": "마르쿠스", "act": "작살을 고쳐 쥔다", "text": "어떻게 할 거야.", "src": [15], "draft": true, "mark": 14}, {"kind": "say", "who": "주인공", "act": "", "text": "소리 내지 말고 따라와.", "src": [16], "draft": true}, {"kind": "tell", "text": "틈을 빠져나오자 천장이 높은 큰 굴이다.", "src": [18], "draft": true, "mark": 17}, {"kind": "tell", "text": "모닥불 둘레에 해적들이 앉아 있고, 물길에는 큰 배가 대어 있다.", "src": [20], "draft": true, "mark": 19}, {"kind": "tell", "text": "[여기서 잠입 플레이: 순찰과 보초의 눈을 피해 널판으로 배에 오른다]", "src": [22], "draft": true, "mark": 21}, {"kind": "tell", "text": "배 밑 화물칸. 짐짝 뒤에 숨자 아이의 목소리가 울린다.", "src": [24], "draft": true, "mark": 23}, {"kind": "say", "who": "루키우스", "act": "", "text": "몰라! 알아도 안 가르쳐 줘! 아저씨가 와서 너희 다 혼내 줄 거야!", "src": [25], "draft": true}, {"kind": "tell", "text": "기둥에 묶인 루키우스가 감시 해적에게 맞서고 있다.", "src": [27], "draft": true, "mark": 26}, {"kind": "tell", "text": "감시가 손을 치켜들자 루키우스가 그 손을 물어 버린다.", "src": [29], "draft": true, "mark": 28}, {"kind": "tell", "text": "입술이 터졌는데도 아이는 울지 않는다.", "src": [31], "draft": true, "mark": 30}, {"kind": "tell", "text": "주인공과 눈이 마주치자, 루키우스가 일부러 소리를 지르며 발로 등잔을 찬다.", "src": [33], "draft": true, "mark": 32}, {"kind": "tell", "text": "감시가 굴러가는 불을 쫓아 고개를 돌린 틈에 줄을 끊는다.", "src": [35], "draft": true, "mark": 34}, {"kind": "say", "who": "주인공", "act": "", "text": "잘했어. 이제 내 뒤에 있어.", "src": [36], "draft": true}, {"kind": "tell", "text": "[여기서 잠입 플레이: 루키우스와 같은 길로 되돌아 나간다]", "src": [38], "draft": true, "mark": 37}, {"kind": "tell", "text": "널판을 내려와 큰 굴로 나서는 순간, 틈 쪽에서 사내 하나가 걸어 나온다.", "src": [40], "draft": true, "mark": 39}, {"kind": "tell", "text": "나갈 길을 막고 선 그 사내가 해적 두목 드라콘이다.", "src": [42], "draft": true, "mark": 41}, {"kind": "say", "who": "드라콘", "act": "", "text": "어디서 쥐새끼 냄새가 난다 했더니…….", "src": [44], "draft": true, "mark": 43}, {"kind": "say", "who": "드라콘", "act": "칼을 뽑는다", "text": "붉은 돌의 주인이 제 발로 왔군.", "src": [46], "draft": true, "mark": 45}, {"kind": "tell", "text": "[여기서 전투 플레이: 드라콘]", "src": [47], "draft": true}, {"kind": "tell", "text": "드라콘의 칼이 마르쿠스를 향한다. 주인공이 몸을 던져 막는다.", "src": [48], "draft": true}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "……너, 미쳤어?", "src": [49], "draft": true}, {"kind": "tell", "text": "싸움 끝에, 드라콘이 무릎을 꿇는다.", "src": [50], "draft": true}], "choices": [{"text": "계속", "to": "1-170", "to_title": "드라콘 처분", "condition": "", "edge": 0, "src": [53]}]}, "1-170": {"id": "1-170", "title": "드라콘 처분", "has_script": true, "stamp": "14b2ed48f5af6082", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 깊은 방.", "src": [2]}, {"kind": "tell", "text": "드라콘이 칼을 놓고 무릎을 꿇은 채 주인공을 올려다본다.", "src": [3], "draft": false}, {"kind": "say", "who": "드라콘", "act": "숨을 몰아쉰다", "text": "죽일 거면 죽여라.", "src": [4], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "죽이지는 않아.", "src": [5], "draft": false}, {"kind": "say", "who": "드라콘", "act": "", "text": "그럼 뭘 할 건데.", "src": [6], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "네가 이겼으니까 네가 정해. 난 아무 말 안 해.", "src": [7], "draft": false}, {"kind": "say", "who": "루키우스", "act": "주인공의 옷자락을 잡는다", "text": "……아저씨.", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "살려 보내면 언젠가 다시 이 바다에 나타나겠지. 섬 밖 관리에게 넘기면 이 섬의 해적 걱정은 끝난다.", "src": [9], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "어느 쪽이 옳은지는…… 아무도 모른다.", "src": [10], "draft": false}], "choices": [{"text": "살려 보낸다", "to": "1-180", "to_title": "돌아오는 길", "condition": "", "edge": 0, "src": [13]}, {"text": "섬 밖 관리에게 넘긴다", "to": "1-180", "to_title": "돌아오는 길", "condition": "", "edge": 1, "src": [14]}]}, "1-180": {"id": "1-180", "title": "돌아오는 길", "has_script": true, "stamp": "2ad37c632bfdc79e", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 마을 어귀.", "src": [2]}, {"kind": "tell", "text": "마을로 돌아오는 길. 루키우스는 주인공의 등에 업혀 있다.", "src": [3], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "아저씨는 어디서 왔어?", "src": [4], "draft": false}, {"kind": "tell", "text": "주인공은 잠시 망설인다.", "src": [5], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "아주 먼 데서. 여기보다 한참 뒤의 시간에서.", "src": [6], "draft": false}, {"kind": "tell", "text": "루키우스는 웃지 않는다.", "src": [7], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "그럼 아저씨는 앞으로 무슨 일이 생기는지 알아?", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "…….", "src": [9], "draft": false}, {"kind": "tell", "text": "주인공은 대답하지 못한다.", "src": [10], "draft": false}, {"kind": "tell", "text": "앞서 걷던 마르쿠스가 멈춘다. 돌아보지 않은 채 말한다.", "src": [11], "draft": false}, {"kind": "say", "who": "마르쿠스", "act": "", "text": "빚졌다. 갚는다. 그게 다야.", "src": [12], "draft": false}, {"kind": "tell", "text": "주인공이 웃는다. 마르쿠스도 아주 조금 웃는다.", "src": [13], "draft": false}, {"kind": "note", "text": "다음 장면은 처분에 따라 저절로 갈림 — 인도면 1-183, 석방이면 1-185(버튼 없음)", "src": [15]}], "choices": [{"text": "드라콘을 넘기기로 했다면", "to": "1-183", "to_title": "드라콘을 넘기다", "condition": "드라콘을 넘기기로 했다면", "edge": 0}, {"text": "드라콘을 놓아줬다면", "to": "1-185", "to_title": "광장 춤", "condition": "드라콘을 놓아줬다면", "edge": 1}]}, "1-183": {"id": "1-183", "title": "드라콘을 넘기다", "has_script": true, "stamp": "3dc7e9bcd79d1438", "lines": [{"kind": "stage", "text": "화면이 어두워진다.", "src": [3]}, {"kind": "stage", "text": "주인공, 세르기우스, 마르쿠스, 루키우스가 장터에 있다.", "src": [5, 7, 9, 11]}, {"kind": "stage", "text": "화면이 밝아진다.", "src": [13]}, {"kind": "stage", "text": "이 장면이 벌어지는 곳은 장터.", "src": [15]}, {"kind": "tell", "text": "이튿날 아침. 포구의 항구 관리소 앞에 사람들이 모였다.", "src": [17], "draft": true}, {"kind": "tell", "text": "밧줄에 묶인 드라콘을 마르쿠스와 어부들이 끌고 온다.", "src": [19], "draft": true, "mark": 18}, {"kind": "tell", "text": "관리소의 관리가 밀랍판에 무언가를 적는다. 섬 밖 큰 항구에서 온 사람이다.", "src": [21], "draft": true, "mark": 20}, {"kind": "tell", "text": "관리는 드라콘을 다음 배로 건너편 관청에 보내겠다고 한다.", "src": [23], "draft": true, "mark": 22}, {"kind": "tell", "text": "은신처에 대어 둔 해적 배는 어젯밤 포구로 끌어다 두었다. 관리소 사람들이 그 배도 끌고 가기로 했다.", "src": [26], "draft": true, "mark": 25}, {"kind": "say", "who": "드라콘", "act": "주인공을 노려본다", "text": "차라리 그 굴에서 끝내지 그랬나.", "src": [28], "draft": true, "mark": 27}, {"kind": "say", "who": "주인공", "act": "", "text": "벌을 정하는 건 우리 몫이 아니야. 이제는 관리가 정할 일이야.", "src": [30], "draft": true, "mark": 29}, {"kind": "say", "who": "드라콘", "act": "", "text": "붉은 돌의 주인이란 놈이 마음이 약하군.", "src": [32], "draft": true, "mark": 31}, {"kind": "say", "who": "마르쿠스", "act": "밧줄을 당긴다", "text": "입 다물어. 애를 묶어 둔 놈이 할 말은 아니지.", "src": [34], "draft": true, "mark": 33}, {"kind": "say", "who": "세르기우스", "act": "관리에게 고개를 숙인다", "text": "섬은 이걸로 됐소.", "src": [36], "draft": true, "mark": 35}, {"kind": "say", "who": "마을 사람", "act": "", "text": "이제 해적 걱정 없이 그물을 치겠네.", "src": [38], "draft": true, "mark": 37}, {"kind": "say", "who": "마을 사람", "act": "", "text": "패거리가 앙갚음하러 오면 어쩌지.", "src": [40], "draft": true, "mark": 39}, {"kind": "say", "who": "마을 사람", "act": "", "text": "두목이 없는 패거리가 무슨 수로. 관리 배가 지키는데.", "src": [42], "draft": true, "mark": 41}, {"kind": "tell", "text": "해적 배가 관리소 사람들의 노에 끌려 포구를 빠져나간다.", "src": [44], "draft": true, "mark": 43}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "저 사람은 이제 이 바다에 다시 나타나지 않겠지.", "src": [46], "draft": true, "mark": 45}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "……그게 옳았는지는, 아직 모르겠다.", "src": [48], "draft": true, "mark": 47}, {"kind": "say", "who": "루키우스", "act": "주인공의 옷자락을 잡는다", "text": "아저씨, 이제 다 끝난 거야?", "src": [50], "draft": true, "mark": 49}, {"kind": "say", "who": "주인공", "act": "", "text": "응. 끝났어. 집에 가자.", "src": [52], "draft": true, "mark": 51}], "choices": [{"text": "계속", "to": "1-185", "to_title": "광장 춤", "condition": "", "edge": 0, "src": [55]}]}, "1-185": {"id": "1-185", "title": "광장 춤", "has_script": true, "stamp": "5282f8215db468ac", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 마을 광장.", "src": [3]}, {"kind": "tell", "text": "해적 일이 모두 끝난 날 저녁. 광장 분수 둘레에 모닥불이 핀다.", "src": [5], "draft": true}, {"kind": "tell", "text": "누군가 북을 두드리고, 누군가 갈대 피리를 분다.", "src": [7], "draft": true, "mark": 6}, {"kind": "say", "who": "마을 사람", "act": "", "text": "아이를 찾아왔으니 신께 감사해야지! 오늘은 춤이다!", "src": [9], "draft": true, "mark": 8}, {"kind": "tell", "text": "사람들이 손을 잡고 분수 둘레를 돈다.", "src": [11], "draft": true, "mark": 10}, {"kind": "tell", "text": "두 걸음 오른쪽, 손뼉 한 번, 두 걸음 왼쪽.", "src": [13], "draft": true, "mark": 12}, {"kind": "say", "who": "티로", "act": "", "text": "페레! 이리 와! 같이 돌아!", "src": [15], "draft": true, "mark": 14}, {"kind": "say", "who": "주인공", "act": "손을 젓는다", "text": "나는 춤은 영…….", "src": [17], "draft": true, "mark": 16}, {"kind": "say", "who": "루키우스", "act": "주인공의 손을 잡아끈다", "text": "오늘은 안 돼. 아저씨 날이잖아.", "src": [19], "draft": true, "mark": 18}, {"kind": "say", "who": "파울라", "act": "", "text": "어렵지 않아요. 둘, 짝, 둘, 짝. 북소리만 들으면 돼요.", "src": [21], "draft": true, "mark": 20}, {"kind": "tell", "text": "주인공이 원 안으로 끌려 들어간다. 첫 손뼉부터 박자가 어긋난다.", "src": [23], "draft": true, "mark": 22}, {"kind": "tell", "text": "[여기서 광장 춤 플레이: 북소리에 맞춰 걸음과 손뼉(아주 쉬운 박자 놀이)]", "src": [25], "draft": true, "mark": 24}, {"kind": "say", "who": "티로", "act": "", "text": "페레 또 틀렸어! 손뼉은 지금이야, 지금!", "src": [27], "draft": true, "mark": 26}, {"kind": "say", "who": "주인공", "act": "웃음이 터진다", "text": "그물 노래보다 어렵네.", "src": [29], "draft": true, "mark": 28}, {"kind": "say", "who": "마을 사람", "act": "깔깔 웃는다", "text": "죽은 사람도 살리는 손이 박자는 못 맞추네!", "src": [31], "draft": true, "mark": 30}, {"kind": "tell", "text": "리쿠스가 북을 넘겨받아 박자를 일부러 천천히 늦춘다.", "src": [33], "draft": true, "mark": 32}, {"kind": "say", "who": "리쿠스", "act": "", "text": "자, 이방인 걸음에 맞춰 주지. 하나…… 둘…….", "src": [35], "draft": true, "mark": 34}, {"kind": "tell", "text": "프리마가 손뼉을 치며 웃는다.", "src": [37], "draft": true, "mark": 36}, {"kind": "tell", "text": "세르기우스는 원 밖에서 팔짱을 낀 채 발끝으로 박자를 맞춘다.", "src": [39], "draft": true, "mark": 38}, {"kind": "tell", "text": "카밀라는 모닥불 곁에 앉아 아이들의 발을 지켜본다.", "src": [41], "draft": true, "mark": 40}, {"kind": "tell", "text": "마르쿠스는 원에 들어오지 않는다. 북소리가 빨라지자 고개만 까딱인다.", "src": [43], "draft": true, "mark": 42}, {"kind": "tell", "text": "리비아는 분수 가장자리에 앉아 원을 바라본다. 웃지는 않는다.", "src": [45], "draft": true, "mark": 44}, {"kind": "tell", "text": "다만 손가락으로 무릎을 두드리며 박자를 따라간다.", "src": [47], "draft": true, "mark": 46}, {"kind": "tell", "text": "노래가 세 번 돌 무렵, 주인공의 손뼉이 처음으로 사람들과 맞는다.", "src": [49], "draft": true, "mark": 48}, {"kind": "say", "who": "루키우스", "act": "", "text": "맞았다! 지금 맞았어!", "src": [51], "draft": true, "mark": 50}, {"kind": "tell", "text": "밤이 깊도록 광장의 북소리가 그치지 않았다.", "src": [53], "draft": true, "mark": 52}], "choices": [{"text": "계속", "to": "1-190", "to_title": "리쿠스의 뱃길 이야기", "condition": "", "edge": 0, "src": [56]}]}, "1-190": {"id": "1-190", "title": "리쿠스의 뱃길 이야기", "has_script": true, "stamp": "5eebd0813628b545", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 리쿠스가 고치는 배.", "src": [2]}, {"kind": "tell", "text": "해적 사건 뒤, 해적에게 부서진 세르기우스의 배를 고치는 날.", "src": [4], "draft": true}, {"kind": "tell", "text": "늙은 뱃사공 리쿠스가 주인공을 일손으로 불러 앉힌다.", "src": [6], "draft": true, "mark": 5}, {"kind": "say", "who": "리쿠스", "act": "", "text": "거기 망치 좀 들어 봐. 그렇지, 손이 제법이네.", "src": [7], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "그 손으로 내 가슴을 눌러 댔다며. 갈비뼈가 아직도 쑤셔.", "src": [8], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "내가 젊을 땐 말이야, 군선에서 노를 저었지. 이 어깨가 그때 망가졌어.", "src": [9], "draft": true}, {"kind": "say", "who": "주인공", "act": "", "text": "군선이요?", "src": [10], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "큰 항구에 큰 배들이 줄줄이 서 있었지. 거기서 배우는 건 딱 하나야.", "src": [11], "draft": true}, {"kind": "say", "who": "주인공", "act": "", "text": "뭔데요?", "src": [12], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "", "text": "일이 터지면 큰 항구에서는 높은 사람 배부터 싣는다. 평민은 창끝에 밀려나고.", "src": [13], "draft": true}, {"kind": "say", "who": "리쿠스", "act": "망치를 내려놓는다", "text": "그래서 바다 사람은 다른 길을 하나 알아 둬야 하는 거야. 들어 볼 텐가? 얘기가 좀 길어.", "src": [14], "draft": true}], "choices": [{"text": "일손을 도우며 끝까지 듣는다", "to": "1-200", "to_title": "별 보는 밤", "condition": "", "edge": 0, "src": [17]}, {"text": "다음에 듣겠다고 한다", "to": "1-200", "to_title": "별 보는 밤", "condition": "", "edge": 1, "src": [18]}]}, "1-200": {"id": "1-200", "title": "별 보는 밤", "has_script": true, "stamp": "e47f3652b867adcb", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 모닥불 자리.", "src": [2]}, {"kind": "tell", "text": "아무 일도 없는 밤. 바닷가 모닥불 곁에서 아이들이 하나둘 잠든다.", "src": [3], "draft": false}, {"kind": "say", "who": "파울라", "act": "티로에게 담요를 덮어 준다", "text": "쉿. 이제 자.", "src": [4], "draft": false}, {"kind": "say", "who": "티로", "act": "잠꼬대", "text": "……반짝반짝…….", "src": [5], "draft": false}, {"kind": "tell", "text": "루키우스도 모래에 글자를 쓰다 말고 잠들었다.", "src": [6], "draft": false}, {"kind": "tell", "text": "리비아는 아직 깨어 있다. 무릎을 끌어안고 하늘을 올려다본다.", "src": [7], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "오늘은 별이 많네요.", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "그러네요.", "src": [9], "draft": false}, {"kind": "tell", "text": "모닥불이 탁, 하고 튄다.", "src": [10], "draft": false}], "choices": [{"text": "리비아 곁에 앉아 별 이야기를 한다", "to": "1-205", "to_title": "토마토 없는 피자", "condition": "", "edge": 0, "src": [13]}, {"text": "모닥불을 지키다 먼저 눕는다", "to": "1-205", "to_title": "토마토 없는 피자", "condition": "", "edge": 1, "src": [14]}]}, "1-205": {"id": "1-205", "title": "토마토 없는 피자", "has_script": true, "stamp": "831290320ef56c36", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 오두막 앞.", "src": [2]}, {"kind": "tell", "text": "별 보는 밤 며칠 뒤. 해 질 녘, 프리마가 오두막 앞 화덕에 불을 지핀다.", "src": [3], "draft": false}, {"kind": "tell", "text": "납작한 빵 반죽이 뜨거운 돌판 위에서 부푼다. 구수한 냄새가 마당에 퍼진다.", "src": [4], "draft": false}, {"kind": "stage", "text": "티로, 루키우스, 파울라가 오두막 앞으로 걸어온다.", "src": [5, 6, 7]}, {"kind": "say", "who": "프리마", "act": "", "text": "오늘은 묵은 반죽이 잘 일었어요. 빵이 폭신하겠네.", "src": [8], "draft": false}, {"kind": "say", "who": "주인공", "act": "빵을 들여다본다", "text": "……여기에 뭘 올리면 딱인데.", "src": [9], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "올려요? 빵은 국에 적셔 먹는 거지, 위에 얹는 게 아니잖아요.", "src": [10], "draft": false}, {"kind": "say", "who": "주인공", "act": "빵을 보며 중얼거린다", "text": "야근하고 오는 밤마다 시켜 먹던 피자……. 먹고 싶다.", "src": [11], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "피자가 뭐야? 먹는 거야? 맛있어?", "src": [12], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "아저씨 고향 음식이야? 우리도 먹어 보고 싶어!", "src": [13], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "좋아, 만들어 볼게. 대신 재료를 좀 모아야 해.", "src": [14], "draft": false}, {"kind": "say", "who": "프리마", "act": "팔을 걷는다", "text": "그늘 광에 있는 건 마음껏 써요. 뭐가 필요해요?", "src": [15], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "올리브기름, 마늘, 양파. 양젖 치즈랑 말린 풀. 그리고 빨갛고 새콤한…….", "src": [16], "draft": false}, {"kind": "say", "who": "주인공", "act": "말을 멈춘다", "text": "……토마토.", "src": [17], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "토마토가 뭐야?", "src": [18], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "빨갛고 동그란 열매야. 새콤달콤하고 물이 많아. 그걸 으깨서 빵에 발라야 하는데.", "src": [19], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "빨간 거? 페레 목걸이 같은 거?", "src": [20], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "먹는 거야. 목걸이는 안 먹어.", "src": [21], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "우리 섬에 그런 열매는 없어요. 장사꾼 배에서도 못 봤고요.", "src": [22], "draft": false}, {"kind": "say", "who": "주인공", "act": "혼잣말", "text": "없겠지. 이 바다 어디에도. ……아직은.", "src": [23], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "괜찮아. 없으면 있는 걸로 하면 돼. 프리마, 양파 넉넉해요?", "src": [24], "draft": false}, {"kind": "tell", "text": "주인공이 반죽을 손바닥으로 얇게 펴고 올리브기름을 바른다. 양파와 마늘은 기름에 느긋이 볶는다.", "src": [25], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "빨간 열매 대신 볶은 양파를 깔게요. 달고 구수하니까 비슷할지도 몰라요.", "src": [26], "draft": false}, {"kind": "tell", "text": "양젖 치즈를 손으로 뜯어 올리고, 올리브와 말린 풀을 흩뿌린다.", "src": [27], "draft": false}, {"kind": "say", "who": "프리마", "act": "항아리에서 가룸을 한 방울 떨어뜨린다", "text": "짠맛은 이게 제일이에요.", "src": [28], "draft": false}, {"kind": "say", "who": "파울라", "act": "무화과 광주리를 내민다", "text": "이것도 올려요. 꿀을 바르면 맛있잖아요.", "src": [29], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "말린 생선! 말린 생선도 올리자!", "src": [30], "draft": false}, {"kind": "say", "who": "주인공", "act": "웃음을 참는다", "text": "고향에서도 과일 올리는 걸 두고 어른들이 편을 갈라 싸워요.", "src": [31], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "반은 무화과와 꿀, 반은 말린 생선으로 해 보자.", "src": [32], "draft": false}, {"kind": "tell", "text": "[여기서 피자 만들기 플레이: 반죽·얹기·굽기]", "src": [33], "draft": false}, {"kind": "tell", "text": "화덕 문을 닫고 기다린다. 아이들이 불꽃만 쳐다보는 사이 치즈가 보글보글 끓는다.", "src": [34], "draft": false}, {"kind": "say", "who": "프리마", "act": "돌판을 꺼낸다", "text": "앗, 뜨거. ……냄새가 이상하게 좋네요.", "src": [35], "draft": false}, {"kind": "tell", "text": "프리마가 첫 조각을 떼어 바다 쪽 땅에 놓는다. 신께 올리는 몫이다.", "src": [36], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "신께 먼저 드려야죠. 또 문어 잡으러 가긴 싫거든요.", "src": [37], "draft": false}, {"kind": "say", "who": "티로", "act": "입을 벌린 채 숨을 후후 분다", "text": "뜨거! 뜨거워! ……근데 또 먹을래!", "src": [38], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "치즈가 녹아서 빵에 쏙 스며들었어! 아저씨, 이거 마법이야?", "src": [39], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "마법 아니야. 불이랑 손이랑 기다림이야.", "src": [40], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "양파가 달아요. 생선도 은근히 어울리고. 무화과는 밥보다 후식 같아요.", "src": [41], "draft": false}, {"kind": "tell", "text": "오두막 그늘에서 그물을 손질하던 리비아가 손을 멈춘다. 프리마가 조각을 내밀자 말없이 받는다.", "src": [42], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "……먹을 만하네요.", "src": [43], "draft": false}, {"kind": "tell", "text": "리비아는 웃지 않는다. 다만 그물을 내려놓고 두 번째 조각에 손을 뻗는다.", "src": [44], "draft": false}, {"kind": "tell", "text": "세르기우스는 한 조각을 통째로 먹어 치우고, 돌판을 프리마 쪽으로 슬쩍 민다.", "src": [45], "draft": false}, {"kind": "say", "who": "프리마", "act": "웃는다", "text": "하나 더 구우라는 뜻이에요.", "src": [46], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "아쉽네요. 제 고향에선 빨간 열매가 있어야 완성인데.", "src": [47], "draft": false}, {"kind": "say", "who": "프리마", "act": "", "text": "없는 걸 아쉬워해 봐야 뭐 해요. 이제 이게 우리 섬 맛이잖아요.", "src": [48], "draft": false}, {"kind": "say", "who": "티로", "act": "", "text": "페레, 나도 해 볼래! 내가 반죽 펼래!", "src": [49], "draft": false}, {"kind": "say", "who": "주인공", "act": "반죽 덩이를 건넨다", "text": "그래. 손바닥으로 밀어. 얇게, 가운데는 더 얇게.", "src": [50], "draft": false}, {"kind": "tell", "text": "티로의 반죽은 구멍투성이다. 프리마가 구멍을 눌러 메우고, 주인공은 팔짱을 낀 채 지켜만 본다.", "src": [51], "draft": false}, {"kind": "say", "who": "루키우스", "act": "", "text": "양파는 내가 볶을래. 타지 않게 계속 저어야 하지?", "src": [52], "draft": false}, {"kind": "say", "who": "파울라", "act": "", "text": "치즈는 내가 뜯을게. 이만큼이면 돼요?", "src": [53], "draft": false}, {"kind": "say", "who": "프리마", "act": "손가락을 꼽는다", "text": "반죽, 기름, 양파, 치즈, 풀. 마지막에 가룸 한 방울.", "src": [54], "draft": false}, {"kind": "tell", "text": "티로의 빵은 조금 타서 나왔다. 아이들이 서로 먹겠다고 다툰다.", "src": [55], "draft": false}, {"kind": "tell", "text": "주인공은 팔을 내리고 화덕 앞의 그림자들을 바라본다. 이제 자기 손은 필요 없다.", "src": [56], "draft": false}, {"kind": "tell", "text": "다음 날부터 아이들이 저마다 납작빵에 이것저것 얹어 먹는다. 마을은 축제 준비로 바빠진다.", "src": [57], "draft": false}], "choices": [{"text": "계속", "to": "1-210", "to_title": "축제 준비", "condition": "", "edge": 0, "src": [60]}]}, "1-210": {"id": "1-210", "title": "축제 준비", "has_script": true, "stamp": "15935eac1a836f1e", "lines": [{"kind": "stage", "text": "이 장면이 벌어지는 곳은 가룸 항아리 터.", "src": [2]}, {"kind": "tell", "text": "마을은 건너편 도시의 불의 신 축제에 내다 팔 물건을 준비한다.", "src": [3], "draft": false}, {"kind": "tell", "text": "주인공은 리비아와 함께 가룸을 담근다. 생선을 손질하고, 소금을 켜켜이 뿌리고, 햇볕에 삭힌다.", "src": [4], "draft": false}, {"kind": "tell", "text": "[여기서 가룸 만들기 플레이: 손질·소금·삭히기]", "src": [5], "draft": false}, {"kind": "say", "who": "주인공", "act": "코를 막는다", "text": "우와…… 이 냄새는 좀…….", "src": [6], "draft": false}, {"kind": "say", "who": "리비아", "act": "처음으로 소리 내어 웃는다", "text": "그 얼굴 좀 봐요!", "src": [7], "draft": false}, {"kind": "say", "who": "주인공", "act": "", "text": "웃었다. 처음으로.", "src": [8], "draft": false}, {"kind": "say", "who": "리비아", "act": "웃음을 거두며", "text": "……못 들은 걸로 해요.", "src": [9], "draft": false}, {"kind": "tell", "text": "손에 비린내가 밴 채로 둘은 항아리 옆에 나란히 앉는다. 해가 진다.", "src": [10], "draft": false}, {"kind": "say", "who": "리비아", "act": "", "text": "페레, 당신 원래 있던 곳으로 돌아가고 싶어요?", "src": [11], "draft": false}, {"kind": "tell", "text": "주인공은 대답을 고른다.", "src": [12], "draft": false}, {"kind": "tell", "text": "주인공이 입을 떼려는 순간, 티로가 모래를 차며 달려온다.", "src": [14], "draft": true, "mark": 13}, {"kind": "say", "who": "티로", "act": "숨을 헐떡이며 para"}, {"src": [436, 436], "stamp": "08d4b2db7e5fe9f8", "marks": [], "text": "\"페레. 나, 당신 말 믿고 싶어요. 정말로.\" 리비아가 말한다. \"그런데 믿으면, 저 많은 사람이 다 죽는다는 거잖아요. 그건 너무 무서워서.\"", "parts": [{"t": "\"페레. 나, 당신 말 믿고 싶어요. 정말로.\" 리비아가 말한다. \"그런데 믿으면, 저 많은 사람이 다 죽는다는 거잖아요. 그건 너무 무서워서.\""}], "kind": "para"}, {"src": [438, 438], "stamp": "46716910ba7bfe1d", "marks": [], "text": "주인공은 그녀의 손을 잡을 뻔한다. 사랑한다고 말할 뻔한다. 그때 아래에서 마르쿠스가 부른다. \"리비아! 프리마 아주머니가 찾으셔!\" 리비아가 내려간다. 내려가다 한 번 돌아본다. 말은 이번에도 하지 못한다.", "parts": [{"t": "주인공은 그녀의 손을 잡을 뻔한다. 사랑한다고 말할 뻔한다. 그때 아래에서 마르쿠스가 부른다. \"리비아! 프리마 아주머니가 찾으셔!\" 리비아가 내려간다. 내려가다 한 번 돌아본다. 말은 이번에도 하지 못한다."}], "kind": "para"}, {"kind": "aside", "title": "그녀의 믿음", "parts": [{"tag": "제안", "note": ""}, {"t": "섬 생활과 설득 구간에서 리비아와 쌓은 믿음이 이 밤의 대화에 묻어난다. 믿음은 다섯 곳에서 한 칸씩 쌓인다. 믿음이 3 이상이면 리비아는 \"내일은 당신 곁에 있을게요\"라고 약속한다. 모자라면 \"내일 얘기해요\"라며 서둘러 내려간다"}, {"tag": "대장 결정", "note": "원문의 '충분하다'를 3 이상으로 확정했다"}, {"t": ". 이 약속이 폭발 때 리비아가 주인공 곁에 있을지, 혼자 누군가를 찾으러 사라질지를 가른다."}], "src": [440, 440], "stamp": "af9bf3de9f8d3f6f", "marks": [{"tag": "대장 결정", "note": "원문의 '충분하다'를 3 이상으로 확정했다"}], "text": "섬 생활과 설득 구간에서 리비아와 쌓은 믿음이 이 밤의 대화에 묻어난다. 믿음은 다섯 곳에서 한 칸씩 쌓인다. 믿음이 3 이상이면 리비아는 \"내일은 당신 곁에 있을게요\"라고 약속한다. 모자라면 \"내일 얘기해요\"라며 서둘러 내려간다. 이 약속이 폭발 때 리비아가 주인공 곁에 있을지, 혼자 누군가를 찾으러 사라질지를 가른다."}, {"src": [442, 442], "stamp": "72c9b684199dc57e", "marks": [{"tag": "제안", "note": ""}], "text": "약속을 받았다면 5부 폭발 직후 주인공이 전날 밤 리비아의 약속을 떠올리며 손을 쥐고, 마지막 수색 전에도 성벽 쪽을 바라본다. 약속을 못 받았다면 확신하지 못한 대화를 떠올리며 주저하고, 답을 듣지 못한 불안이 성벽 쪽 시선에 남는다. 믿음이 4 이상이면 시장에서 기다리는 리비아의 손에 주인공 몫의 물병이 들려 있다.", "parts": [{"t": "약속을 받았다면 5부 폭발 직후 주인공이 전날 밤 리비아의 약속을 떠올리며 손을 쥐고, 마지막 수색 전에도 성벽 쪽을 바라본다. 약속을 못 받았다면 확신하지 못한 대화를 떠올리며 주저하고, 답을 듣지 못한 불안이 성벽 쪽 시선에 남는다. 믿음이 4 이상이면 시장에서 기다리는 리비아의 손에 주인공 몫의 물병이 들려 있다"}, {"tag": "제안", "note": ""}, {"t": "."}], "kind": "trace"}, {"src": [444, 444], "stamp": "047510b9540b13e1", "marks": [{"tag": "대장 결정", "note": ""}], "text": "믿음이 쌓이는 곳은 다섯이다. 축제 준비에서 솔직하게 대답하기, 카밀라에게 이유를 묻기, 별 보는 밤, 저녁 시장 골목에서 리비아의 마음을 묻기, 항 , "kind": "trace"}, {"src": [613, 613], "stamp": "f8b989bdf0d71f5a", "marks": [{"tag": "제안", "note": ""}], "text": "섬으로 돌아온 뒤 주인공은 밤마다 같은 꿈을 꾼다. 성벽 위의 불빛, \"믿고 싶어요\"라던 목소리, 하지 못한 말. 리비아가 남긴 자리마다 그녀가 보여서, 주인공은 이 섬에 더 머물 수 없다. 카밀라가 아이들을 먼저 안아 주고, 세르기우스와 프리마가 딸이 돌아오지 않은 자리를 바라본다. 카밀라에게 도시를 싫어하는 이유를 물었다면 카밀라는 리비아의 빈 허리끈 자리를 오래 바라본다. 마르쿠스와의 시간이 두 칸 이상이라면 꿈 속 산길에 앞서 달려 나가는 마르쿠스의 뒷모습이 한 컷 섞인다. 별 보는 밤을 함께했다면 꿈에 별 한 컷이 낀다. 다프네를 데려왔다면 아이들 곁에 한 사람이 더 있다.", "parts": [{"t": "섬으로 돌아온 뒤 주인공은 밤마다 같은 꿈을 꾼다. 성벽 위의 불빛, \"믿고 싶어요\"라던 목소리, 하지 못한 말. 리비아가 남긴 자리마다 그녀가 보여서, 주인공은 이 섬에 더 머물 수 없다. 카밀라가 아이들을 먼저 안아 주고, 세르기우스와 프리마가 딸이 돌아오지 않은 자리를 바라본다"}, {"tag": "제안", "note": ""}, {"t": ". 카밀라에게 도시를 싫어하는 이유를 물었다면 카밀라는 리비아의 빈 허리끈 자리를 오래 바라본다. 마르쿠스와의 시간이 두 칸 이상이라면 꿈 속 산길에 앞서 달려 나가는 마르쿠스의 뒷모습이 한 컷 섞인다. 별 보는 밤을 함께했다면 꿈에 별 한 컷이 낀다. 다프네를 데려왔다면 아이들 곁에 한 사람이 더 있다."}], "kind": "para"}, {"src": [615, 615], "stamp": "8174ea44d3a63531", "marks": [{"tag": "제안", "note": ""}, {"tag": "제안", "note": ""}], "text": "어느 저녁, 주인공은 루키우스를 바닷가로 부른다. 목걸이를 풀어 아이의 목에 걸어 준다. \"좋은 건 혼자 쥐고 있는 게 아니야. 다음 사람한테 건네는 거지.\" 루키우스가 묻는다. \"누나 얘기도 해 줄 거야?\" 주인공은 고개를 끄덕인다. 그리고 처음으로 운다. 루키우스는 바위에 누나의 이름을 긁어 적는다.", "parts": [{"t": "어느 저녁, 주인공은 루키우스를 바닷가로 부른다. 목걸이를 풀어 아이의 목에 걸어 준다. \"좋은 건 혼자 쥐고 있는 게 아니야. 다음 사람한테 건네는 거지"}, {"tag": "제안", "note": ""}, {"t": ".\" 루키우스가 묻는다. \"누나 얘기도 해 줄 거야?\" 주인공은 고개를 끄덕인다. 그리고 처음으로 운다. 루키우스는 바위에 누나의 이름을 긁어 적는다"}, {"tag": "제안", "note": ""}, {"t": "."}], "kind": "para"}, {"src": [617, 617], "stamp": "85108f8c4d7fb2f9", "marks": [{"tag": "사용자 확정", "note": ""}, {"tag": "대장 결정", "note": ""}, {"tag": "제안", "note": ""}], "text": "다음 날 아침, 주인공은 배를 타고 섬을 떠난다. 어디로 가는지는 아무도 모른다. 구하지 못한 사람들의 얼굴은 어디를 가든 평생 가슴속 짐으로 남는다. 이 엔딩의 감정은 선택의 죄책감이 아니라 구하지 못한 무력감과, 그래도 아이들을 지켜 냈다는 쓰린 위안이다. 리쿠스가 노 하나를 건넨다.", "parts": [{"t": "다음 날 아침, 주인공은 배를 타고 섬을 떠난다. 어디로 가는지는 아무도 모른다"}, {"tag": "사용자 확정", "note": ""}, {"t": ". 구하지 못한 사람들의 얼굴은 어디를 가든 평생 가슴속 짐으로 남는다. 이 엔딩의 감정은 선택의 죄책감이 아니라 구하지 못한 무력감과, 그래도 아이들을 지켜 냈다는 쓰린 위안이다"}, {"tag": "대장 결정", "note": , "1-220"], "first_scene": "1-100"}, {"name": "리쿠스", "also": "", "age": "예순둘", "who": "늙은 뱃사공이자 뱃목수", "home": "리쿠스의 집", "group": "섬 사람들", "traits": [{"label": "누구", "text": "예순두 살. 섬 뱃사공이자 뱃목수. 젊을 때 로마 군선의 노잡이였다."}, {"label": "사람됨", "text": "넉살 좋고 농을 잘한다. 일에는 엄하다. 은혜는 꼭 갚는다."}, {"label": "말투", "text": "「~게」「~군」「~나」로 끝나는 늙은 뱃사람 말투."}, {"label": "부르는 말", "text": "아이들 「리쿠스 할아버지」, 어른들 「영감님」."}], "new": true, "tags": [], "scenes": ["1-055", "1-090", "1-185", "1-190"], "first_scene": "1-055"}, {"name": "바르바투스", "also": "", "age": "일흔 안팎", "who": "섬 신전의 늙은 신전지기", "home": "신전", "group": "섬 사람들", "traits": [{"label": "누구", "text": "일흔 안팎. 섬의 넵투누스 신전을 지키는 신전지기."}, {"label": "사람됨", "text": "겉은 엄숙, 속은 먹보. 벌을 내리되 가볍게 내린다."}, {"label": "말투", "text": "「~느니라」「~도다」「~하거라」. 헛기침이 잦다."}, {"label": "부르는 말", "text": "아이들 「할아버지」, 어른들 「신전지기 어르신」."}], "new": true, "tags": [], "scenes": ["1-085"], "first_scene": "1-085"}, {"name": "마을 사람", "also": "", "age": "", "who": "이름 없는 섬사람들", "home": "이웃집들", "group": "섬 사람들", "traits": [{"label": "", "text": "이름 없는 섬사람들. 처음엔 주인공을 「이방인」이라며 거리를 두고, 일이 쌓이며 받아들인다."}, {"label": "", "text": "겉모습은 세 부류: 어부 사내, 아낙, 노인."}], "new": false, "tags": [], "scenes": ["1-020", "1-030", "1-040", "1-055", "1-060", "1-070", "1-085", "1-090", "1-120", "1-125", "1-130", "1-140", "1-150", "1-183", "1-185"], "first_scene": "1-020"}, {"name": "테르티우스", "also": "", "age": "쉰 안팎", "who": "섬을 도는 장사꾼", "home": "배를 타고 다닌다", "group": "섬 밖", "traits": [{"label": "누구", "text": "쉰 안팎. 섬을 돌며 물건을 파는 장사꾼. 셈으로 섬사람을 속이려 든다."}, {"label": "대사집 이름표", "text": "「테르티우스(상인)」."}], "new": true, "tags": [], "scenes": ["1-130"], "first_scene": "1-130"}, {"name": "드라콘", "also": "", "age": "마흔 안팎", "who": "해적 두목", "home": "해적 은신처", "group": "섬 밖", "traits": [{"label": "누구", "text": "마흔 안팎. 해적 두목. 잡힌 뒤에도 굽히지 않는다(「죽일 거면 죽여라.」)."}, {"label": "줄거리에서", "text": "놓아주느냐 넘기느냐가 결말을 가르는 선택이 된다."}], "new": true, "tags": [], "scenes": ["1-140", "1-160", "1-170", "1-183"], "first_scene": "1-140"}, {"name": "아울루스 셈프로니우     if (kind === "충돌") await K.send("/api/시험/덧쓰기", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, line: "> 게임대장이 그사이 덧쓴 해설." }) });
    $("sw-edit").click();
    go("대본/" + id, { push: false, record: false });
    document.querySelector(`#sc-${id} [data-i="${i}"]`).click();

<script>
