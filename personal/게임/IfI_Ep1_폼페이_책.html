function edgeText(id, i, x) {
  const c = (D.script[id] ? D.script[id].choices : []).find((ch) => ch.edge === i);
  return x.condition || (c && c.text !== "계속" ? c.text : "") || x.label || "다음으로";
}
function renderMap() {
  const v = $("view-map");
  v.append(el("p", { class: "lede" }, "위에서 아래로 이야기가 흐릅니다. 굵은 테두리는 대사가 있는 장면, 점선은 앞의 선택에 따라서만 거치는 곁길입니다. 장면 이름을 누르면 그 상자로 갑니다."));
  v.append(el("div", { class: "parts" }, D.map.parts.map((p) =>
    el("button", { class: "chip", "data-part": p.name, onclick: () => selectPart(p.name) }, p.name))));
  const map = el("div", { class: "map" });
  for (const p of D.map.parts) {
    const box = el("div", { class: "mpart", "data-part": p.name }, el("div", { class: "part-head" }, p.name));
    p.scenes.forEach((id, i) => drawNode(box, id, p.scenes[i + 1]));
    map.append(box);
  }
  v.append(map);
  drawSeven(v); drawEndings(v); drawTraces(v);
  if (D.map.parts.length) selectPart(D.map.parts[0].name);
}
function drawNode(box, id, next) {
  const n = D.map.nodes[id], L = linksOf(id);
  const meet = new Set(L.from.map((x) => x.id)).size > 1;
  const hasScript = D.script[id] && D.script[id].has_script;
  box.append(el("div", { class: "node" + (hasScript ? " has-script" : "") + (n.side ? " side" : ""), id: "mp-" + id },
    el("h4", {}, sceneTitle(id), el("span", { class: "num" }, id), n.kind !== "장면" ? el("span", { class: "part" }, n.kind) : ""),
    el("div", { class: "sum" }, n.summary),
    meet ? el("div", { class: "meet" }, "갈라졌던 길이 여기서 다시 만납니다") : "",
    el("div", { class: "cross" }, el("button", { class: "chip", onclick: jumper("대본/" + id) }, "대본에서 보기"),
      sectionOf(id) ? el("button", { class: "chip", onclick: jumper("이야기/" + sectionOf(id).id) }, "이야기에서 보기") : "")));
  const to = L.to;
  const plain = to.length === 1 && to[0].id === next && !to[0].condition && !to[0].effects.length && edgeText(id, 0, to[0]) === "다음으로";
  if (plain) { box.append(el("div", { class: "down" }, "↓")); return; }
  if (!to.length) return;
  box.append(el("div", { class: "forks" }, to.map((x, i) => el("div", { class: "fk" },
    x.condition ? "" : "▶ ", el("span", { class: "lbl" }, edgeText(id, i, x)), " → ",
    el("button", { class: "go", onclick: jumper("지도/" + x.id) }, sceneTitle(x.id)),
    x.touches_ending ? el("span", { class: "ending" }, "결말에 닿는 선택") : "",
    x.effects.map((e) => el("span", { class: "sm" }, e))))));
}
function drawSeven(v) {
  v.append(el("h3", { class: "big" }, "결말을 가르는 일곱 가지"));
  v.append(el("table", { class: "t" }, el("thead", {}, el("tr", {}, ["무엇", "어떤 값", "어디서 정해지나"].map((h) => el("th", {}, h)))),
    el("tbody", {}, D.map.seven.map((r) => el("tr", {},
      el("td", {}, el("b", {}, r.name), el("div", { class: "sm" }, r.meaning)), el("td", {}, r.values.join(" · ")),
      el("td", {}, r.decided_at.length ? el("div", { class: "cross" }, r.decided_at.map((id) =>
        el("button", { class: "chip", onclick: jumper("지도/" + id) }, sceneTitle(id)))) : "앞의 선택으로 저절로"))))));
}
function drawEndings(v) {
  v.append(el("h3", { class: "big" }, "결말은 이렇게 정해집니다"));
  if (D.map.endings.stale) v.append(el("div", { class: "stale" }, "이 설명은 옛 규칙 기준일 수 있습니다. 갈림길 규칙이 바뀌었습니다."));
  v.append(...D.map.endings.text.map((t) => el("p", {}, t)));
}
function drawTraces(v) {
  v.append(el("h3", { class: "big" }, "뒤에 남는 자국"));
  v.append(el("p", { class: "lede" }, "앞에서 한 선택이 뒤의 장면에 남기는 작은 차이입니다. 이야기의 줄기와 결말은 바꾸지 않습니다."));
  v.append(el("table", { class: "t" }, el("thead", {}, el("tr", {}, ["앞에서 한 일", "어디에 남나", "무엇이 달라지나", "언제"].map((h) => el("th", {}, h)))),
    el("tbody", {}, D.map.traces.map((t) => el("tr", {},
      el("td", {}, D.map.nodes[t.from] ? el("button", { class: "go", onclick: jumper("지도/" + t.from) }, sceneTitle(t.from)) : t.from,
        el("div", { class: "sm" }, t.choice)),
      el("td", {}, t.where), el("td", {}, t.change), el("td", {}, t.when))))));
}

/* ── 인물: 책_인물화면.js(renderPeople·personOf·peopleText) ── */

/* ── 찾기 ── */
function search(q) {
  q = q.trim();
  const hits = [];
  const add = (kind, text, route) => { if (hits.length < 60) hits.push({ kind, text, route }); };
  if (q) {
    for (const id of order()) {
      const s = D.script[id];
      if (sceneTitle(id).includes(q)) add("장면", sceneTitle(id), "대본/" + id);
      for (const l of (s ? s.lines : [])) {
        const t = (l.who ? l.who + ": " : "") + (l.text || "");
        if (l.kind !== "stage" && t.includes(q)) add("대본 · " + sceneTitle(id), t, "대본/" + id);
      }
    }
    for (const c of D.story.chapters) for (const sec of c.sections) for (const b of sec.blocks) {
      const t = blockText(b);
      if (t.includes(q)) add("이야기 · " + (sec.title || c.title), snippet(t, q), "이야기/" + sec.id);
    }
    for (const p of D.people.people) if (peopleText(p).includes(q)) add("인물", p.name + " — " + p.who, "인물/" + p.name);
  }
  const box = $("results-box");
  box.replaceChildren(...(q ? [el("div", { class: "sm" }, "「" + q + "」 찾은 곳 " + hits.length + "개" + (hits.length >= 60 ? "(앞의 60개만)" : ""))] : []),
    ...hits.map((h) => el("button", { class: "hit", onclick: () => { go(h.route); } }, el("small", {}, h.kind), h.text)));
  $("results").classList.toggle("on", !!q);
  return hits;
}
const partsText = (parts) => (parts || []).map((p) => p.t || "").join("");
function blockText(b) {      // 찾기용 글: 본문 조각만(표시·덧말은 뺌)
  if (b.kind === "list") return b.items.map((it) => partsText(it.parts)).join(" ");
  if (b.kind === "table") return b.rows.map((r) => r.join(" ")).join(" ");
  return (b.title ? b.title + " " : "") + partsText(b.parts);
}
function snippet(t, q) {
  t = t.replace(/\s+/g, " ");
  const i = t.indexOf(q);
  return (i > 40 ? "…" : "") + t.slice(Math.max(0, i - 40), i + 80) + "…";
}

/* ── 띠·스위치·시작 ── */
function renderBands() {
  const bands = $("bands");
  const band = (head, items) => {
    const list = el("ul", { hidden: "" }, items.map((t) => el("li", {}, t)));
    return el("div", { class: "band", onclick: (e) => { if (e.target === e.currentTarget || e.target.tagName === "SPAN") list.hidden = !list.hidden; } },
      el("span", {}, head + " (누르면 목록)"), list);
  };
  if (D.missing.length) bands.append(band("뜻풀이가 없는 말이 " + D.missing.length + "개 있습니다",
    D.missing.map((m) => m.kind + ": " + m.what + " — 어디: " + m.where)));
  if (D.problems.length) bands.append(band("읽지 못한 원본이 " + D.problems.length + "개 있습니다", D.problems));
}
function renderAll() {
  ["bands", "view-story", "view-script", "view-map", "view-people"].forEach((id) => $(id).replaceChildren());
  $("made").textContent = "만든 때 " + D.made + (D.editable ? " · 「고치기」를 켜면 대본을 고칠 수 있습니다" : " · 읽기만 하는 책");
  renderBands(); renderStory(); renderScript(); renderMap(); renderPeople();
}
function rerenderAll(data) {     // 저장 뒤 새 자료로 다시 그린다(보던 탭·자리 그대로)
  const y = window.scrollY, v = view, part = (document.querySelector(".mpart.on") || {}).dataset;
  D = data;
  renderAll();
  showView(v);
  if (part) selectPart(part.part);
  window.scrollTo({ top: y, behavior: "instant" });
}
window.책화면 = { rerenderAll, el, go, tagChip, sceneTitle };
function start(data) {
  D = data;
  if (TEST && window.책시험) window.책시험.before(D);
  $("book-title").textContent = D.title;
  if (D.editable && window.책고치기) 책고치기.setup();
  if (D.editable && window.책고치기 && window.책이야기고치기) 책이야기고치기.setup();
  if (D.editable && window.책고치기 && window.책기록) 책기록.setup();
  renderAll();
  showView("script");
  if (TEST && window.책시험) return window.책시험.run();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.includes("=")) photo(h);
  else if (h) go(h, { push: false, record: false });
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { showView(t.dataset.view); window.scrollTo(0, 0); }));
$("sw-dir").addEventListener("change", (e) => document.body.classList.toggle("show-dir", e.target.checked));
$("sw-tag").addEventListener("change", (e) => document.body.classList.toggle("show-tag", e.target.checked));
$("sw-dark").addEventListener("change", (e) => { document.documentElement.dataset.theme = e.target.checked ? "dark" : "light"; });
$("toc-btn").addEventListener("click", () => { showView("script"); tocOpen = $("toc").classList.toggle("open"); });
let findTimer = null;
$("find").addEventListener("input", (e) => { clearTimeout(findTimer); findTimer = setTimeout(() => search(e.target.value), 200); });
$("find").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.target.value = ""; search(""); } });
if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) { $("sw-dark").checked = true; document.documentElement.dataset.theme = "dark"; }

/* 사진 찍기용(주소 뒤 #밤=1&보기=map&뛰기=지도/1-170&사진=1 — 화면에는 안 보임) */
function photo(h) {
  const o = Object.fromEntries(h.split("&").map((x) => x.split("=")));
  if (o["밤"]) { $("sw-dark").checked = o["밤"] === "1"; document.documentElement.dataset.theme = o["밤"] === "1" ? "dark" : "light"; }
  if (o["연출"] === "1") $("sw-dir").click();
  if (o["딱지"] === "1") $("sw-tag").click();
  if (o["보기"]) showView(o["보기"]);
  if (o["찾기"]) { $("find").value = o["찾기"]; search(o["찾기"]); }
  if (o["뛰기"]) go(o["뛰기"], { push: false });
  if (o["고치기사진"] && window.책시험 && D.editable) return window.책시험.photo(o["고치기사진"]);
  if (o["사진"] === "1") photoTop(document.querySelector(".flash"));
}
function photoTop(t) {         // 헤드리스 사진은 내려 보낸 화면을 못 찍어서, 그곳 앞의 내용을 접어 맨 위에 오게 한다
  for (let p = t; p && p.tagName !== "SECTION"; p = p.parentElement)
    for (let s = p.previousElementSibling; s; s = s.previousElementSibling) if (!s.classList.contains("toc")) s.style.display = "none";
  window.scrollTo(0, 0);
}

if (window.책자료) start(window.책자료);
else fetch("/api/reader", { cache: "no-store" }).then((r) => r.json()).then(start).catch(() => {
  $("bands").append(el("div", { class: "band" }, "책 자료를 불러오지 못했습니다. 「이야기 책」 검은 창이 켜져 있는지 확인하세요."));
});
