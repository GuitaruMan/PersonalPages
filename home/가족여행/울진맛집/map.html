<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>울진 맛집 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --deep:#0b2530;
  --sea:#14424f;
  --foam:#9fd0cf;
  --salt:#eef3f2;
  --paper:#ffffff;
  --ink:#10222a;
  --muted:#5a6e75;
  --line:#cfdcdb;
  --crab:#d83a25;
  --crab-dark:#a82a19;
  --kelp:#2b7a68;
  --sun:#f0b429;
  --sun-bg:#fff4d6;
  --cafe:#14787f;
  --cafe-bg:#dcf0f1;
  --food-bg:#fde6e1;
  --display:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--salt);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}

.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--deep);color:#fff;padding:12px 20px}
.bar h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:0}
.bar h1 em{font-style:normal;color:var(--crab)}
.bar p{margin:0;font-size:12.5px;color:var(--foam)}
.switch{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--crab);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px}
.switch:hover{background:var(--crab-dark)}
.back{display:block;font-size:12px;color:var(--foam);text-decoration:none}
.back:hover{color:#fff}

.wrap{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
#map{min-height:0;background:#cfe3e4}
.side{min-height:0;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line)}
.legend{padding:12px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.filter{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.filter button{font:600 13.5px var(--body);cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 13px;display:inline-flex;align-items:center;gap:7px}
.filter button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.filter small{font-weight:400;opacity:.75}
.dot{display:inline-block;width:11px;height:11px;flex:none}
.dot.food{background:var(--crab);border-radius:50%}
.dot.cafe{background:var(--cafe);transform:rotate(45deg) scale(.85)}

/* 지도 위 표시: 밥집 = 동그라미, 카페 = 마름모 */
.pin{width:20px;height:20px;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.food{background:var(--crab);border-radius:50%}
.pin.cafe{background:var(--cafe);border-radius:3px;transform:rotate(45deg) scale(.9)}
.pin.approx{opacity:.55;border-style:dashed}
.pin.on{outline:3px solid var(--sun);outline-offset:1px}
.pin-wrap[hidden]{display:none}
.grp{margin:0;padding:12px 18px 4px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--sea)}
.list{list-style:none;margin:0;padding:0 8px 8px}
.list button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 10px;border-radius:8px}
.list button:hover,.list button.on{background:#e3f1ee}
.list button:focus-visible{outline:3px solid var(--sun)}
.list b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.list li[hidden],.grp[hidden]{display:none}
.list .meta{display:block;font-size:12.5px;color:var(--muted);padding-left:19px}
.list .nomap{color:var(--crab-dark)}

/* 팝업 */
.leaflet-popup-content{margin:14px 16px;font-family:var(--body);font-size:13.5px;line-height:1.55;color:var(--ink)}
.pp-cat{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px}
.pp-cat.food{color:var(--crab-dark);background:var(--food-bg)}
.pp-cat.cafe{color:var(--cafe);background:var(--cafe-bg)}
.leaflet-popup-content p{margin:0}
.leaflet-popup-content p.pp-nm{font-family:var(--display);font-size:20px;margin:4px 0 2px;line-height:1.25}
.leaflet-popup-content p.pp-sig{margin:0 0 6px;color:#34484f}
.pp-row{color:var(--muted)}
.leaflet-popup-content p.pp-approx{margin:6px 0 0;font-size:12px;color:#6a5208;background:var(--sun-bg);border-radius:4px;padding:2px 6px}
.pp-go{display:inline-block;margin-top:8px;font-weight:600;color:var(--crab-dark)}

@media (max-width:760px){
  .bar{padding:10px 14px}
  .bar h1{font-size:21px}
  .bar p{display:none}
  .wrap{grid-template-columns:1fr;grid-template-rows:58vh 1fr}
  .side{order:2;border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>

// 밥집 / 카페 거르기
const count = k => DATA.filter(d => !k || d.kind === k).length;

  `<button type="button" data-k="${k}" aria-pressed="${k === ""}">${cls ? `<span class="dot ${cls}"></span>` : ""}${label} <small>${count(k)}</small></button>`

filterEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");

  const k = b.dataset.k;
  filterEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  for (const d of DATA){
    const show = !k || d.kind === k;
    const m = markers[d.id];
    if (m) show ? m.addTo(map) : m.remove();
  }
  document.querySelectorAll(".list li").forEach(li => li.hidden = !!k && li.dataset.kind !== k);
  document.querySelectorAll(".list").forEach(ul => {
    const empty = !ul.querySelector("li:not([hidden])");
    ul.hidden = empty;
    ul.previousElementSibling.hidden = empty;
  });
});

function select(id, fly){
  document.querySelectorAll(".list button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("on", p.dataset.id === id));
  const m = markers[id];
  if (!m) return;
  if (fly) map.setView(m.getLatLng(), Math.max(map.getZoom(), 14), {animate: !matchMedia("(prefers-reduced-motion: reduce)").matches});
  m.openPopup();
}
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) select(b.dataset.id, true);
});
