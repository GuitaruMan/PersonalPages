  @media (max-width: 520px) { .list { grid-template-columns: repeat(2, 1fr); } .doc-icon { font-size: 2.6rem; } }
  .date { font-size: 0.7rem; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: 0.95rem; margin-top: 2rem; }

  <script>
    fetch('../dates.json').then(r => r.json()).then(dates => {
      document.querySelectorAll('[data-file]').forEach(el => {

        const d = dates[key] || dates[el.getAttribute('data-file')];
