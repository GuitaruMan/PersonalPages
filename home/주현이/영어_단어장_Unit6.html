<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어장 Unit 6 Being Creative - My Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22304a;--sub:#55617f;--line:#d5dcec;--bg1:#DDEEFF;--bg2:#F6FAFF;--c:#2D7FF9;--cl:#EAF2FF;--cd:#1A57B8;
  --ok:#1FA65A;--okl:#E3F7EB;--no:#E5484D;--nol:#FFECEE;--gold:#FFB020}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:'Nunito','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 420px) no-repeat,var(--bg2);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
#app{max-width:1060px;margin:0 auto;padding:0 22px 70px}
.f{font-family:'Fredoka','Jua',sans-serif}.j{font-family:'Jua','Malgun Gothic',sans-serif}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 17px;border-radius:14px;background:#fff;font-weight:800;font-size:.95rem;
  border:2px solid #c3cfe8;box-shadow:0 4px 0 #c3cfe8;transition:transform .08s,box-shadow .08s;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c3cfe8}
.btn.pri{background:var(--c);border-color:var(--cd);color:#fff;box-shadow:0 4px 0 var(--cd)}
.btn.pri:active{box-shadow:0 1px 0 var(--cd)}
.btn.big{font-size:1.1rem;padding:13px 26px;border-radius:18px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--sub);font-weight:700}
.btn[disabled]{opacity:.45;pointer-events:none}
.tg{font-family:'Fredoka','Jua';font-weight:700;font-size:.75rem;background:var(--c);color:#fff;border-radius:99px;padding:2px 11px;white-space:nowrap}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:30;padding:12px 0 10px;
  background:linear-gradient(var(--bg1) 78%,rgba(221,238,255,0))}
.bar .home{background:#22304a;border-color:#0f1a30;color:#fff;box-shadow:0 4px 0 #0f1a30}
.bar .home:active{box-shadow:0 1px 0 #0f1a30}
.bar .nav{display:flex;gap:6px;flex-wrap:wrap}
.bar .nav a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:800;font-size:.85rem;padding:7px 12px;border-radius:12px;
  background:#fff;border:2px solid var(--nc);box-shadow:0 3px 0 var(--nc)}
.bar .nav a.on{background:var(--nc);color:#fff}
.bar .nav a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--nc)}
.bar .sp{flex:1}
.bar .tot{font-family:'Fredoka';font-weight:700;background:#fff;border-radius:99px;padding:6px 14px;border:2px solid var(--gold);color:#8a5a00;font-size:.9rem;white-space:nowrap}
.bar .snd{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #c3cfe8;font-size:1.05rem}

/* home */
.hero{background:linear-gradient(135deg,#2D7FF9,#12A594);color:#fff;border-radius:28px;padding:30px 36px 34px;position:relative;overflow:hidden;margin-top:18px;
  box-shadow:0 8px 0 #0d6f8f}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:260px;height:260px;right:-60px;top:-90px}.hero::after{width:130px;height:130px;right:170px;bottom:-50px}
.hero .tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.hero .tags b{font-family:'Fredoka';font-weight:600;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.7);border-radius:99px;padding:1px 13px}
.hero .who{font-family:'Jua';font-size:1.5rem;margin-top:16px;line-height:1}
.hero h1{font-family:'Fredoka';font-weight:700;font-size:3.3rem;line-height:1.02;letter-spacing:-1px;margin-top:6px}
.hero h1 span{color:#FFE066}
.hero .units{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:2}
.hero .units div{background:#fff;color:var(--ink);border-radius:11px;padding:3px 14px;font-family:'Fredoka';font-weight:500}
.hero .units b{color:#2D7FF9;margin-right:6px}
.hero svg{position:absolute;right:44px;top:34px;width:150px;z-index:2;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.meter{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 22px;margin-top:20px;border:2px solid #e2e9f6}
.meter .lab{font-family:'Jua';font-size:1.1rem;white-space:nowrap}
.meter .track{flex:1;height:18px;border-radius:99px;background:#EEF2FA;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD166,#FFB020);transition:width .6s}
.meter .num{font-family:'Fredoka';font-weight:700;color:#8a5a00;white-space:nowrap}
.clear{background:#FFF6DF;border:3px solid var(--gold);border-radius:22px;padding:18px;text-align:center;margin-top:18px}
.clear h2{font-family:'Fredoka';font-weight:700;font-size:1.9rem;color:#A96A00;letter-spacing:1px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.mp{display:block;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--c);border-radius:24px;padding:20px 18px 16px;text-align:center;
  box-shadow:0 7px 0 var(--cd);transition:transform .1s,box-shadow .1s;position:relative}
.mp:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--cd)}
.mp:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.mp .ico{width:68px;height:68px;border-radius:50%;background:var(--cl);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.mp h3{font-family:'Jua';font-weight:400;font-size:1.55rem;line-height:1.2;margin-top:6px}
.mp .nk{font-family:'Fredoka';font-weight:600;color:var(--c);font-size:.95rem}
.mp p{font-size:.82rem;color:var(--sub);margin:6px 0 10px;min-height:2.6em;line-height:1.4}
.mp .pg{height:10px;border-radius:99px;background:var(--cl);overflow:hidden}
.mp .pg i{display:block;height:100%;background:var(--c);border-radius:99px}
.mp .cnt{font-family:'Fredoka';font-weight:600;font-size:.85rem;color:var(--cd);margin-top:5px}
.mp .done{position:absolute;right:-8px;top:-10px;background:var(--gold);color:#fff;font-family:'Fredoka';font-weight:700;border-radius:99px;padding:3px 12px;font-size:.8rem;transform:rotate(8deg);box-shadow:0 3px 0 #b97f00}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:26px}
.foot .sp{flex:1}

/* stage list */
.sth{display:flex;align-items:center;gap:14px;margin:10px 0 18px}
.sth .ico{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex:none}
.sth h1{font-family:'Jua';font-weight:400;font-size:2rem;line-height:1.1}
.sth h1 em{font-family:'Fredoka';font-style:normal;font-weight:600;font-size:1.1rem;color:var(--c);margin-left:8px}
.sth p{color:var(--sub);font-size:.9rem}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ac{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--c);border-radius:20px;padding:14px 18px;
  box-shadow:0 6px 0 var(--cd);transition:transform .1s,box-shadow .1s}
.ac:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--cd)}
.ac:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.ac .no{font-family:'Fredoka';font-weight:700;color:#fff;background:var(--c);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ac .e{font-size:1.9rem;flex:none}
.ac .t{flex:1;min-width:0}
.ac .t b{font-family:'Jua';font-weight:400;font-size:1.15rem;display:block;line-height:1.25}
.ac .t span{font-size:.8rem;color:var(--sub)}
.ac .k{font-family:'Fredoka','Jua';font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--cl);color:var(--cd);margin-left:6px;vertical-align:2px}
.stars{font-size:1.25rem;letter-spacing:2px;white-space:nowrap;color:#d3d9e8}
.stars b{color:var(--gold);font-weight:400}

/* activity */
.crumb{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.crumb h1{font-family:'Jua';font-weight:400;font-size:1.55rem;line-height:1.2;flex:1;min-width:200px}
.play{background:#fff;border:3px solid var(--c);border-radius:26px;padding:24px 28px 28px;box-shadow:0 7px 0 var(--cd);min-height:420px}
.step-h{display:flex;align-items:center;gap:10px;font-family:'Jua';font-size:1.2rem;margin-bottom:6px}
.guide{color:var(--sub);font-size:.9rem;margin-bottom:14px}
.guide b{color:var(--cd)}
.prog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--cl);overflow:hidden}
.prog-in{height:100%;width:0;background:var(--c);border-radius:99px;transition:width .35s}
.prog-lab{font-family:'Fredoka';font-weight:600;color:var(--cd);font-size:.9rem;white-space:nowrap}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.fb{margin-top:16px;border-radius:16px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--okl);color:#14703d;border:2px solid var(--ok)}
.fb.no{background:var(--nol);color:#a52328;border:2px solid var(--no)}
.fb .sp{flex:1}
.donebar{display:flex;justify-content:center;margin-top:24px}

/* mcq */
.q{text-align:center}
.q .qt{font-size:1.5rem;font-weight:800;line-height:1.4}
.q .qt .gap{display:inline-block;min-width:90px;border-bottom:4px solid var(--c);margin:0 4px;color:var(--c)}
.q .qs{color:var(--sub);font-size:.95rem;margin-top:4px}
.q .qe{font-size:4rem;line-height:1.1}
.q .hintv{display:inline-block;font-family:'Fredoka';font-weight:600;background:var(--cl);color:var(--cd);border-radius:10px;padding:1px 12px;margin-left:8px;font-size:1.1rem}
.picq{position:relative;width:290px;height:262px;border-radius:20px;overflow:hidden;margin:0 auto 10px;border:3px solid var(--c)}
.picq img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.picq::before{content:"?";position:absolute;z-index:2;left:0;top:0;width:76%;height:36%;background:var(--c);color:#fff;border-radius:0 0 22px 0;
  font:700 2rem 'Fredoka';display:flex;align-items:center;justify-content:center}
.ring{width:130px;height:130px;border-radius:50%;border:12px solid #E5484D;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;position:relative;background:#fff;line-height:1}
.ring::after{content:"";position:absolute;left:50%;top:50%;width:120px;height:12px;background:#E5484D;transform:translate(-50%,-50%) rotate(45deg)}
.opts{display:grid;gap:12px;margin-top:20px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c1{grid-template-columns:1fr;max-width:640px;margin-left:auto;margin-right:auto}
.opt{background:#fff;border:3px solid #c3cfe8;border-radius:18px;padding:14px 16px;font-size:1.15rem;font-weight:800;box-shadow:0 5px 0 #c3cfe8;transition:transform .08s;line-height:1.3}
.opt:hover{border-color:var(--c)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #c3cfe8}
.opt.sel{border-color:var(--c);background:var(--cl);box-shadow:0 5px 0 var(--c)}
.opt.ok{border-color:var(--ok);background:var(--okl);box-shadow:0 5px 0 var(--ok);color:#14703d}
.opt.no{border-color:var(--no);background:var(--nol);box-shadow:0 5px 0 var(--no);color:#a52328;opacity:.75}
.opt[disabled]{pointer-events:none}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border:3px solid #c3cfe8;border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 #c3cfe8;min-height:58px;line-height:1.25}
.mcard small{display:block;font-family:'Noto Sans KR';font-weight:400;font-size:.78rem;color:var(--sub)}
.mcard.l{font-family:'Fredoka';font-weight:500;font-size:1.2rem}
.mcard.sel{border-color:var(--c);background:var(--cl);box-shadow:0 4px 0 var(--c)}
.mcard.ok{border-color:var(--ok);background:var(--okl);box-shadow:none;color:#14703d;transform:translateY(4px);pointer-events:none}
.mcard.no{border-color:var(--no);background:var(--nol)}

/* build */
.bd{text-align:center}
.bd .pe{font-size:3.2rem;line-height:1.1}
.bd .pk{font-family:'Jua';font-size:1.5rem}
.bd .ps{color:var(--sub);font-size:.9rem}
.slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:20px 0 22px;min-height:58px}
.slot{min-width:46px;height:54px;border-bottom:4px solid #c3cfe8;border-radius:10px 10px 0 0;background:#F4F7FD;font:600 1.6rem 'Fredoka';display:flex;align-items:center;justify-content:center;padding:0 10px}
.slot.w{min-width:70px;font-family:'Nunito';font-weight:800;font-size:1.25rem}
.slot.fill{background:var(--okl);border-color:var(--ok);color:#14703d}
.slot.cur{border-color:var(--c);background:var(--cl)}
.slot.gap{background:none;border:none;min-width:18px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tok{background:#fff;border:3px solid var(--c);border-radius:14px;min-width:54px;height:56px;padding:0 14px;font:600 1.6rem 'Fredoka';box-shadow:0 5px 0 var(--cd);transition:transform .08s}
.tok.w{font-family:'Nunito';font-weight:800;font-size:1.2rem}
.tok:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.tok.used{visibility:hidden}

/* order */
.ord{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.ord button{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid #c3cfe8;border-radius:18px;padding:12px 16px;font-size:1.15rem;font-weight:800;box-shadow:0 5px 0 #c3cfe8}
.ord button i{font:700 1.3rem 'Fredoka';font-style:normal;width:44px;height:44px;border-radius:12px;border:3px dashed #c3cfe8;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ord button.on{border-color:var(--c);background:var(--cl);box-shadow:0 5px 0 var(--c)}
.ord button.on i{background:var(--c);border:3px solid var(--c)}
.ord button.ok{border-color:var(--ok);background:var(--okl);box-shadow:0 5px 0 var(--ok)}.ord button.ok i{background:var(--ok);border-color:var(--ok)}
.ord button.no{border-color:var(--no);background:var(--nol);box-shadow:0 5px 0 var(--no)}.ord button.no i{background:var(--no);border-color:var(--no)}

/* cloze */
.cz{font-size:1.3rem;font-weight:700;line-height:2.5;text-align:left}
.cz.one{text-align:center;font-size:1.5rem;font-weight:800}
.czko{text-align:center;color:var(--sub);font-size:.95rem;margin-top:2px}
.blk{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:44px;border-radius:12px;border:3px dashed #c3cfe8;background:#F4F7FD;margin:0 5px;
  vertical-align:middle;font:600 1.15rem 'Fredoka';padding:0 12px;color:#9aa4bd}
.blk.cur{border-color:var(--c);border-style:solid;background:var(--cl)}
.blk.fill{border:3px solid var(--ok);background:var(--okl);color:#14703d}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px;padding-top:18px;border-top:3px dashed var(--cl)}
.bank .tok{font-size:1.2rem;height:50px}

/* type */
.ty{max-width:820px;margin:0 auto;text-align:center}
.ty .ko{font-family:'Jua';font-size:1.6rem;line-height:1.35}
.ty .hint{color:var(--sub);font-size:.9rem;margin-top:6px;min-height:1.5em}
.ty .hint b{font-family:'Fredoka';font-weight:600;color:var(--cd);letter-spacing:1px}
.ty input{width:100%;margin-top:16px;border:3px solid #c3cfe8;border-radius:18px;padding:14px 20px;font-size:1.4rem;font-weight:700;text-align:center;outline:none;background:#FAFCFF}
.ty input:focus{border-color:var(--c)}
.ty input.ok{border-color:var(--ok);background:var(--okl)}.ty input.no{border-color:var(--no);background:var(--nol)}
.ty .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* cards */
.grp{font-family:'Jua';font-size:1.15rem;color:var(--cd);margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.grp:first-child{margin-top:0}
.grp::after{content:"";flex:1;border-bottom:2px dashed var(--c);opacity:.5}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cg.mini{grid-template-columns:repeat(4,1fr);gap:10px}
.cd{background:#fff;border:3px solid var(--c);border-radius:20px;overflow:hidden;text-align:center;box-shadow:0 5px 0 var(--cd);display:flex;flex-direction:column;cursor:pointer;position:relative}
.cd .im{height:228px;overflow:hidden;background:#eee}
.cd .im img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;display:block}
.cd .em{font-size:2.6rem;line-height:1;padding-top:14px}
.cd .w{font-family:'Fredoka';font-weight:600;font-size:1.5rem;color:var(--cd);line-height:1.2;padding:10px 12px 0}
.cd .pr{font-family:'Noto Sans KR','Malgun Gothic';font-weight:500;font-size:.85rem;color:var(--c);line-height:1.3}
.cd .bk{padding:4px 12px 14px;min-height:74px;display:flex;flex-direction:column;justify-content:center}
.cd .bk .tap{color:#aab3c9;font-size:.85rem}
.cd .bk .m{font-weight:700;font-size:1.05rem;font-family:'Noto Sans KR'}
.cd .bk .x{font-size:.9rem;color:var(--sub);margin-top:3px;line-height:1.35;padding:0 8px}
.cd .bk .x b{color:var(--cd)}
.cd .bk .m,.cd .bk .x{display:none}
.cd.open .bk .m,.cd.open .bk .x{display:block}.cd.open .bk .tap{display:none}
.cd.open{background:var(--cl)}
.cg.mini .cd{border-width:2px;border-radius:14px;box-shadow:0 4px 0 var(--cd)}
.cg.mini .cd .w{font-size:1.15rem;padding:10px 8px 0}
.cg.mini .cd .bk{min-height:48px;padding:2px 8px 10px}
.cg.mini .cd .bk .m{font-size:.92rem}
.cg.mini .cd .pr{font-size:.78rem}
.cnt-line{text-align:center;color:var(--sub);font-size:.9rem;margin-top:18px}

/* info */
.info h3{font-family:'Jua';font-weight:400;font-size:1.25rem;display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.info h3:first-child{margin-top:0}
.fm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fm span{font:600 1.25rem 'Fredoka','Jua';color:#fff;border-radius:12px;padding:3px 18px}
.fm .b1{background:#7C5CFC}.fm .b2{background:#FF6B4A}.fm .b3{background:#12A594}.fm .b4{background:#2D7FF9}
.fm i{font-style:normal;font-weight:800;color:var(--sub);font-size:1.2rem}
.fm em{font-style:normal;font-family:'Jua';font-size:1.15rem;color:var(--cd);margin-left:10px;background:var(--cl);padding:2px 16px;border-radius:99px}
.exs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{display:flex;align-items:center;gap:10px;background:var(--cl);border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.05rem;line-height:1.3}
.ex small{display:block;font-family:'Noto Sans KR';font-weight:400;font-size:.8rem;color:var(--sub)}
.ex b{color:var(--cd)}
.warn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.warn div{border-radius:14px;padding:8px 16px;font-weight:800;font-size:1.05rem}
.warn .x{background:var(--nol);border:2px solid var(--no);color:#a52328}
.warn .o{background:var(--okl);border:2px solid var(--ok);color:#14703d}

function progress(host, n) {

  host.append(h("div", { class: "prog-wrap" }, h("div", { class: "prog" }, fill), lab));
  return { set(i) { fill.style.width = (i / n * 100) + "%"; lab.textContent = Math.min(i + 1, n) + " / " + n; } };
}
function doneBar(host, label, fn) {

}

ENG.mcq = (host, cfg, done) => {
  let items = cfg.gen ? cfg.gen() : cfg.items.slice();
  if (!cfg.keep) items = shuffle(items);
  if (cfg.pick) items = items.slice(0, cfg.pick);
  let i = 0, miss = 0;
  const bar = progress(host, items.length), box = h("div", { class: "q" });
  host.append(box);
  function show() {
    if (i >= items.length) return done(miss, items.length);
    bar.set(i);
    const it = items[i];
    box.innerHTML = "";
    if (it.pic) box.append(h("div", { class: "picq" }, h("img", { src: IMG + it.pic, alt: "" })));
    if (it.ring) box.append(h("div", { class: "ring" }, it.ring));

    if (it.sub) box.append(h("div", { class: "qs", html: it.sub }));
    const right = it.a == null ? [0] : [].concat(it.a);
    let opts = it.opts.map((t, k) => ({ t, k }));
    if (!it.fixed) opts = shuffle(opts);
    const cols = it.cols || cfg.cols || 2;
    const grid = h("div", { class: "opts", style: { gridTemplateColumns: `repeat(${cols},1fr)`, maxWidth: cols === 1 ? "680px" : "", margin: cols === 1 ? "20px auto 0" : "" } });
    const fb = h("div");

      const next = () => { i++; show(); };
      if (it.why) fb.append(h("div", { class: "fb ok" }, "정답! ", it.why, h("span", { class: "sp" }), h("button", { class: "btn pri", type: "button", onclick: next }, "다음 ▶")));

    if (it.multi) {

ENG.match = (host, cfg, done) => {
  const per = cfg.per || 6;
  let pairs = shuffle(cfg.pairs);
  if (cfg.pick) pairs = pairs.slice(0, cfg.pick);
  const rounds = [];
  for (let k = 0; k < pairs.length; k += per) rounds.push(pairs.slice(k, k + per));
  let r = 0, miss = 0;
  const bar = progress(host, rounds.length), box = h("div", { class: "match" });
  host.append(box);
  function round() {
    if (r >= rounds.length) return done(miss, pairs.length);
    bar.set(r);
    box.innerHTML = "";
    const sel = { l: null, r: null };
    let left = rounds[r].length;
    const cols = { l: h("div", { class: "col" }), r: h("div", { class: "col" }) };
    const mk = (o, side) => {
      const b = h("button", { class: "mcard " + side, type: "button", html: o.t });
      b.onclick = () => {
        if (sel[side]) sel[side].b.classList.remove("sel");
        sel[side] = { o, b }; b.classList.add("sel"); sfx.tap();
        if (!sel.l || !sel.r) return;
        const a = sel.l, c = sel.r;
        sel.l = sel.r = null;
        [a.b, c.b].forEach(x => x.classList.remove("sel"));
        if (a.o.k === c.o.k) {
          [a.b, c.b].forEach(x => x.classList.add("ok"));
          sfx.ok(); left--;
          if (!left) later(() => { r++; round(); }, 750);
        } else {
          miss++; sfx.no();
          [a.b, c.b].forEach(x => { x.classList.add("no", "shake"); setTimeout(() => x.classList.remove("no", "shake"), 450); });
        }
      };
      return b;
    };
    rounds[r].map((p, k) => ({ k, t: p[0] })).forEach(o => cols.l.append(mk(o, "l")));
    mixed(rounds[r].map((p, k) => ({ k, t: p[1] }))).forEach(o => cols.r.append(mk(o, "r")));
    box.append(cols.l, cols.r);
  }
  round();
};

function clozeBox(box, text, extra, onDone, onMiss, one) {
  const blanks = [];
  const p = h("div", { class: "cz" + (one ? " one" : "") });
  text.split(/\{([^}]+)\}/).forEach((part, idx) => {
    if (idx % 2 === 0) { p.append(part); return; }
    const el = h("button", { class: "blk", type: "button" }, String(blanks.length + 1));
    const bl = { ans: part, el, done: false };
    el.onclick = () => { if (!bl.done) setCur(blanks.indexOf(bl)); };
    blanks.push(bl); p.append(el);
  });
  let cur = 0;
  function setCur(k) { cur = k; blanks.forEach((b, n) => b.el.classList.toggle("cur", n === k && !b.done)); }
  const bank = h("div", { class: "bank" });
  shuffle(blanks.map(b => b.ans).concat(extra || [])).forEach(t => {
    const b = h("button", { class: "tok w", type: "button" }, t);
    b.onclick = () => {
      const bl = blanks[cur];
      if (!bl || bl.done) return;
      if (t !== bl.ans) { onMiss(); sfx.no(); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
      bl.done = true; bl.el.textContent = t; bl.el.classList.add("fill"); bl.el.classList.remove("cur");
      b.classList.add("used"); b.disabled = true;
      const nx = blanks.findIndex(x => !x.done);
      if (nx < 0) { sfx.ok(); onDone(); } else { sfx.tap(); setCur(nx); }
    };
    bank.append(b);
  });
  setCur(0);
  box.append(p, bank);
  return blanks.length;
}

ENG.crossword = (host, cfg, done) => {
  const cw = cfg.cw, cell = {};
  const keyOf = (y, x) => y + "," + x;
  const cellsOf = w => Array.from(w.word, (ch, i) => cell[keyOf(w.y + (w.d === "V" ? i : 0), w.x + (w.d === "H" ? i : 0))]);
  cw.words.forEach(w => {
    w.okd = false;
    Array.from(w.word).forEach((ch, i) => {
      const y = w.y + (w.d === "V" ? i : 0), x = w.x + (w.d === "H" ? i : 0), k = keyOf(y, x);
      (cell[k] = cell[k] || { ch, y, x, ws: [], lock: false }).ws.push(w);
      if (i === 0) cell[k].num = w.num;
    });
  });
  let cur = null, miss = 0, solved = 0;
  const grid = h("div", { class: "cwg", style: { gridTemplateColumns: `repeat(${cw.w},42px)` } });
  function paint(at) {
    Object.values(cell).forEach(c => { c.el.classList.toggle("hl", !!cur && c.ws.includes(cur) && !c.lock); c.el.classList.toggle("at", c === at && !c.lock); });
    cw.words.forEach(w => w.li.classList.toggle("hl", w === cur && !w.okd));
  }
  function focusCell(c) { if (c) { c.inp.focus(); paint(c); } }
  function pick(w, c) {
    cur = w;
    const cs = cellsOf(w);
    focusCell(c || cs.find(x => !x.inp.value) || cs[0]);
  }
  function judge(w) {
    const cs = cellsOf(w);
    if (w.okd || cs.some(c => !c.inp.value)) return;
    if (cs.every(c => c.inp.value.toUpperCase() === c.ch)) {
      w.okd = true; solved++;
      cs.forEach(c => { c.lock = true; c.inp.readOnly = true; c.el.classList.remove("no", "hl", "at"); c.el.classList.add("ok"); });
      w.li.classList.add("ok"); sfx.ok();
      if (solved === cw.words.length) later(() => done(miss, cw.words.length), 900);
    } else {
      miss++; sfx.no();
      cs.forEach(c => { if (!c.lock && c.inp.value.toUpperCase() !== c.ch) { c.el.classList.add("no", "shake"); setTimeout(() => c.el.classList.remove("shake"), 400); } });
    }
  }
  for (let y = 0; y < cw.h; y++) for (let x = 0; x < cw.w; x++) {
    const c = cell[keyOf(y, x)];
    if (!c) { grid.append(h("div", { class: "cwx" })); continue; }
    c.inp = h("input", { type: "text", maxlength: "2", autocomplete: "off", autocapitalize: "characters", autocorrect: "off", spellcheck: "false", inputmode: "text", "aria-label": `${y + 1}행 ${x + 1}열` });
    c.el = h("div", { class: "cwc" }, c.num && h("sup", null, c.num), c.inp);
    const step = d => {
      if (!cur) return null;
      const cs = cellsOf(cur), k = cs.indexOf(c);
      for (let n = k + d; n >= 0 && n < cs.length; n += d) if (!cs[n].lock) return cs[n];
      return null;
    };
    c.inp.addEventListener("focus", () => { if (!cur || !c.ws.includes(cur)) cur = c.ws.find(w => !w.okd) || c.ws[0]; paint(c); });
    c.inp.addEventListener("mousedown", () => { if (document.activeElement === c.inp && c.ws.length > 1) { cur = c.ws.find(w => w !== cur) || cur; paint(c); } });
    c.inp.addEventListener("input", () => {
      if (c.lock) { c.inp.value = c.ch; return; }
      const v = c.inp.value.replace(/[^a-zA-Z]/g, "").slice(-1).toUpperCase();
      c.inp.value = v; c.el.classList.remove("no");
      if (!v) return;
      sfx.tap();
      const words = c.ws.slice();
      words.forEach(judge);
      if (!cur || cur.okd) { const nw = c.ws.find(w => !w.okd) || cw.words.find(w => !w.okd); if (nw && nw !== cur) { if (c.ws.includes(nw)) cur = nw; else return pick(nw); } }
      const nx = step(1);
      if (nx) focusCell(nx); else paint(c);
    });
    c.inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !c.inp.value) { const pv = step(-1); if (pv) { pv.inp.value = ""; pv.el.classList.remove("no"); focusCell(pv); e.preventDefault(); } }
      const mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
      if (mv) { const t = cell[keyOf(c.y + mv[0], c.x + mv[1])]; if (t) { const want = mv[0] ? "V" : "H"; cur = t.ws.find(w => w.d === want) || t.ws[0]; focusCell(t); } e.preventDefault(); }
    });
    grid.append(c.el);
  }
  const lists = h("div", { class: "cl" });
  [["H", "➡ Across (가로)"], ["V", "⬇ Down (세로)"]].forEach(([d, t]) => {
    const ol = h("ol");
    cw.words.filter(w => w.d === d).sort((a, b) => a.num - b.num).forEach(w => {
      w.li = h("li", { onclick: () => { if (!w.okd) pick(w); } }, h("b", null, w.num), h("span", null, w.clue, " ", h("i", null, `(${w.word.length})`)));
      ol.append(w.li);
    });
    lists.append(h("h4", null, t), ol);
  });
  const hintBtn = h("button", { class: "btn", type: "button", onclick: () => {
    if (!cur || cur.okd) return;
    const c = cellsOf(cur).find(x => !x.lock && x.inp.value.toUpperCase() !== x.ch);
    if (!c) return;
    miss++; c.inp.value = c.ch; c.el.classList.remove("no");
    c.ws.slice().forEach(judge);
    paint(c);
  } }, "💡 글자 힌트 (별이 줄어요)");
  host.append(h("div", { class: "cww" }, h("div", null, grid, h("div", { style: { marginTop: "14px" } }, hintBtn)), lists));
};

    w.li = h("li", null, h("span", { class: "e" }, w.emoji), h("span", null, w.ko), w.b);
    list.append(w.li);
  });
  const msg = h("p", { class: "guide", style: { marginTop: "12px" } }, `남은 단어 ${left}개`);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const b = h("button", { type: "button" }, G[y][x]);
    btn[y + "," + x] = b;
    b.onclick = () => {
      if (!first) { first = [y, x]; b.classList.add("first"); sfx.tap(); return; }

      first = null;
      const dy = y - ay, dx = x - ax, len = Math.max(Math.abs(dy), Math.abs(dx)) + 1;

      const sy = Math.sign(dy), sx = Math.sign(dx), cells = [];
      for (let i = 0; i < len; i++) cells.push([ay + sy * i, ax + sx * i]);
      const str = cells.map(c => G[c[0]][c[1]]).join(""), rev = str.split("").reverse().join("");
      const w = words.find(w => !w.found && (w.w === str || w.w === rev));
      if (!w) { sfx.no(); cells.forEach(c => { const e = btn[c.join(",")]; e.classList.add("shake"); setTimeout(() => e.classList.remove("shake"), 400); }); return; }
      w.found = true; left--;
      cells.forEach(c => btn[c.join(",")].classList.add("fd"));
      w.li.classList.add("ok"); w.b.textContent = w.real + " ✓";
      msg.textContent = left ? `남은 단어 ${left}개` : "모두 찾았어요!";
      sfx.ok();
      if (!left) later(() => done(0, words.length), 1100);
    };
    grid.append(b);
  }
  host.append(h("div", { class: "wsw" }, grid, h("div", null, list, msg)));
};

ENG.memo = (host, cfg, done, act) => {

  host.append(wrap);
  doneBar(host, "다 외웠어요 ✓", () => done(got.size === cfg.items.length ? 0 : 3, 3));
};

      h("div", { html: '<svg viewBox="0 0 100 120"><use href="#drop"/></svg>' }).firstChild),

    all && h("div", { class: "clear" }, h("h2", null, "🏆 MISSION CLEAR 🏆"), h("p", null, `모든 미션을 끝까지 해냈어요! 별 ${tot}개를 모았어요. 별 3개가 아닌 게임에 다시 도전해 볼까요?`)),

function confetti() {
  const fx = document.getElementById("fx"), col = ["#FF6B4A", "#12A594", "#7C5CFC", "#2D7FF9", "#FFB020", "#E0457B"];
  for (let i = 0; i < 70; i++) {

function activity(st, ai) {
  theme(st);
  const act = st.acts[ai], run = RUN;
  const play = h("div", { class: "play" });
  app.append(topbar(st),
    h("div", { class: "crumb" }, h("a", { class: "btn", href: "#" + st.id }, `← ${st.no} ${st.name}`), h("h1", null, act.e + " " + act.title), h("span", { class: "tg" }, act.kind)),
    play);
  let miss = 0, total = 0, si = 0;
  function step() {
    if (run !== RUN) return;
    if (si >= act.steps.length) return finish();
    const sc = act.steps[si];
    play.innerHTML = "";
    if (act.steps.length > 1 || sc.title) play.append(h("div", { class: "step-h" }, act.steps.length > 1 && h("span", { class: "tg" }, `${si + 1} / ${act.steps.length}`), sc.title || ""));
    if (sc.guide) play.append(h("p", { class: "guide", html: sc.guide }));
    const body = h("div");
    play.append(body);
    if (si) window.scrollTo({ top: 0 });
    ENG[sc.type](body, sc, (m, t) => { if (run !== RUN) return; miss += m || 0; total += t || 0; si++; step(); }, act);
  }
  function finish() {
    const game = act.kind !== "학습";
    const stars = !game || miss === 0 ? 3 : miss <= Math.max(2, Math.round(total * .25)) ? 2 : 1;
    S.stars[act.id] = Math.max(S.stars[act.id] || 0, stars);
    save();
    sfx.win(); confetti();
    const last = ai === st.acts.length - 1;
    const close = () => modal.remove();
    const modal = h("div", { class: "modal" }, h("div", { class: "box", style: { "--c": st.c, "--cd": st.cd } },
      h("div", { class: "big", html: Array.from({ length: 3 }, (_, k) => k < stars ? `<b style="animation-delay:${k * .18}s">★</b>` : "★").join("") }),
      h("h2", null, stars === 3 ? "완벽해요!" : stars === 2 ? "잘했어요!" : "끝까지 해냈어요!"),
      h("p", null, game ? (miss ? `실수 ${miss}번 · 다시 하면 별을 더 모을 수 있어요` : "한 번도 틀리지 않았어요") : "미션 완료"),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: () => { close(); render(); } }, "↺ 다시 하기"),
        last ? h("a", { class: "btn pri", href: "#" + st.id, onclick: close }, "스테이지 목록 ▶") : h("a", { class: "btn pri", href: `#${st.id}/${ai + 2}`, onclick: close }, "다음 미션 ▶"),
        h("a", { class: "btn", href: "#", onclick: close }, "🏠 미션 지도"))));
    document.body.append(modal);

  step();
}
function render() {

  app.innerHTML = "";
  const m = location.hash.replace(/^#/, "").split("/");
  const st = STAGES.find(s => s.id === m[0]);

  else if (m[1] && st.acts[m[1] - 1]) activity(st, m[1] - 1);
